html{scroll-padding-top:env(safe-area-inset-top,0px);min-height:100%}
body{margin:0;min-height:100vh;background-color:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
body::before{content:"";position:fixed;inset:0;z-index:-1;background-image:var(--bg-overlay),var(--bg-photo);background-size:cover;background-position:center center;background-repeat:no-repeat;pointer-events:none}
#app{max-width:1000px;margin:0 auto;padding:16px 14px 28px}
h1{font-size:21px;margin:4px 0 12px;letter-spacing:-.01em;text-shadow:var(--title-shadow)}h2{font-size:15px;margin:18px 0 8px;text-shadow:var(--title-shadow)}
.topbar{position:fixed;right:12px;top:8px;font:13px system-ui;z-index:5;display:flex;align-items:center;gap:10px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--bd);padding:4px 12px;border-radius:999px;box-shadow:var(--shadow)}
.topbar a{color:var(--ac);text-decoration:none;font-weight:600}.topbar a:hover{text-decoration:underline}
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px}
.tabs button{flex:none;padding:8px 13px;border:1px solid var(--bd);background:var(--sf);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--fg);border-radius:9px;font:inherit;font-size:13px;font-weight:500;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.06);transition:all .15s ease}
.tabs button:hover{border-color:var(--ac)}
.tabs button.on{background:var(--ac);color:var(--acf);border-color:var(--ac);font-weight:600;box-shadow:0 3px 10px rgba(15,118,110,.3)}
.card{border:1px solid var(--bd);border-radius:12px;padding:14px;background:var(--sf);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:var(--shadow)}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px;font-weight:500}
input,select,textarea{width:100%;box-sizing:border-box;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--in-bg);color:var(--fg);font:inherit;transition:border-color .15s ease}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac)}
.btn{margin-top:12px;padding:10px 16px;border:0;border-radius:9px;background:var(--ac);color:var(--acf);font:inherit;font-weight:600;width:100%;cursor:pointer;box-shadow:0 2px 6px rgba(15,118,110,.22);transition:background .15s ease}
.btn:hover{background:var(--ac-hover)}
.btn.s{background:var(--in-bg);color:var(--fg);border:1px solid var(--bd);margin-top:8px;box-shadow:none}
.btn.s:hover{border-color:var(--ac)}
.jobs{display:flex;flex-wrap:wrap;gap:8px}.jobs label{display:flex;align-items:center;gap:6px;margin:0;padding:7px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--in-bg);color:var(--fg);font-size:14px;width:auto;cursor:pointer}.jobs input{width:auto}
.w{overflow-x:auto;background:var(--sf);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--bd);border-radius:10px;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:6px 8px;border-bottom:1px solid var(--bd);border-right:1px solid var(--bd);text-align:right;white-space:nowrap}
th:last-child,td:last-child{border-right:0}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(even) td{background:var(--zebra)}
th{background:var(--ac);color:var(--acf);white-space:normal}td.l,th.l{text-align:left;white-space:normal}
tr.t td{font-weight:700;background:var(--in-bg) !important}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.mu{color:var(--mu);font-size:12px}.x{border:0;background:none;color:#d33;font-size:16px;cursor:pointer}
.bs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:6px;margin-top:8px}
.bs-cell{display:flex;align-items:center;gap:6px;background:var(--in-bg);border:1px solid var(--bd);border-radius:8px;padding:4px 7px}
.bs-cell span{font-size:12px;color:var(--mu);min-width:46px;white-space:nowrap}
.bs-cell input{padding:5px 6px;border:1px solid var(--bd);border-radius:6px;background:var(--sf-solid);text-align:right;font-size:13px}
.bs-cell.has{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 9%,var(--sf-solid))}
details.card>summary{cursor:pointer;font-weight:700;font-size:14px;user-select:none;color:var(--ac)}

function saveM(){const ms=$('#tm').value.split('\n').map(l=>l.split('|')).filter(p=>p[0].trim()).map(p=>({n:p[0].trim(),hm:parseFloat(p[1])||0,solar0:parseFloat(p[2])||0,ganti:parseFloat(p[3])||0,iv:parseFloat(p[5])||0,...(()=>{const w={},fx={},jobs=[];(p[4]||'').split(';').map(x=>x.trim()).filter(Boolean).forEach(x=>{const i=x.lastIndexOf(':'),s=i>0?x.slice(i+1).trim():'',v=s?parseFloat(s):NaN,nm=x.slice(0,i).trim();if(!isNaN(v)){jobs.push(nm);if(/j$/i.test(s))fx[nm]=v;else w[nm]=v}else jobs.push(x)});return{jobs,w,fx}})()}));

async function exp(mi){
 try{
  if(typeof ExcelJS==='undefined'){alert('Library ExcelJS belum termuat. Periksa koneksi internet lalu muat ulang halaman.');return}
  const m=S.machines[mi];if(!m){alert('Data mesin tidak ditemukan.');return}
  const logMos=sorted(m.n).map(l=>l.d.slice(0,7));
  const solMos=Object.keys(S.solar).filter(k=>k.split('|')[0]===m.n&&(+S.solar[k]||0)>0).map(k=>k.split('|')[1].slice(0,7));
  const months=[...new Set([...logMos,...solMos])].sort();if(!months.length){alert('Belum ada data.');return}
  const multiYear=new Set(months.map(x=>x.slice(0,4))).size>1;
  const wb=new ExcelJS.Workbook(),thin={style:'thin'},bd={top:thin,left:thin,bottom:thin,right:thin};
  months.forEach(mo=>{
   const R=build(m.n,mo);if(!R.length)return;
   const wsName=BLN[+mo.slice(5)-1]+(multiYear?' '+mo.slice(0,4):'');
   const ws=wb.addWorksheet(wsName),H=['NO','HARI','TGL/BLN/TH','HM AWAL','HM AKHIR','HM PEMAKAIAN','HM SHI','ISI SOLAR ( L )','SHI ( L )','L/HM','KETERANGAN','OPERATOR','JAM KERJA OPERATOR','JAM DARI-SAMPAI'];
   ws.mergeCells('B1:O1');const t=ws.getCell('B1');t.value='Monitoring HM '+m.n;t.font={bold:true,size:14};t.alignment={horizontal:'center'};
   H.forEach((h,i)=>{const c=ws.getCell(2,i+2);c.value=h;c.font={bold:true,color:{argb:'FFFFFFFF'}};c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF1F3864'}};c.alignment={horizontal:'center',vertical:'middle',wrapText:true};c.border=bd});
   const hs0=R[0].hs-R[0].g,J0=R[0].J-R[0].sol;let pf=0,fx=0;
   R.forEach((r,i)=>{const x=i+3,p=x-1,set=(c,v)=>{ws.getCell(c+x).value=v};
    set('E',i?{formula:'F'+p,result:r.s}:r.s);set('F',r.f);if(r.sf){const q=ws.getCell('F'+x);q.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFFFE699'}};q.font={bold:true}}set('G',{formula:`F${x}-E${x}`,result:r.g});
    set('H',{formula:(i?`H${p}`:hs0)+`+G${x}`,result:r.hs});set('L',r.ket);set('M',r.op||'');set('O',r.ja?r.ja+'-'+r.jb:'');set('N',r.jo||0);
    if(r.first){set('B',r.day);set('C',r.hari);set('D',new Date(Date.UTC(r.y,r.mm-1,r.day)));set('I',r.sol);
     set('J',{formula:pf?`J${pf}+I${x}`:`I${x}+${J0}`,result:r.J});set('K',{formula:`J${x}/H${x}`,result:r.hs?r.J/r.hs:0});
     pf=x;if(r.cnt>1)['B','C','D','I','J','K'].forEach(c=>ws.mergeCells(`${c}${x}:${c}${x+r.cnt-1}`))}
    fx=x});
   for(let x=3;x<=fx;x++)for(let c=2;c<=15;c++){const cl=ws.getCell(x,c);cl.border=bd;cl.alignment={vertical:'middle',horizontal:(c===12||c===13)?'left':'center',wrapText:(c===12||c===13)};if([5,6,7,8,10,14].includes(c))cl.numFmt='0.0';if(c===4)cl.numFmt='dd/mm/yyyy';if(c===11)cl.numFmt='0.00'}
   const f=fx+2;ws.getCell('H'+f).value='TOTAL SOLAR (L)';ws.getCell('I'+f).value={formula:`SUM(I3:I${fx})`};
   ws.getCell('H'+(f+1)).value='HM BARU GANTI';ws.getCell('I'+(f+1)).value=svcBase(m.n);
   ws.getCell('H'+(f+2)).value='HM SEKARANG';ws.getCell('I'+(f+2)).value={formula:'F'+fx,result:R[R.length-1].f};
   ws.getCell('H'+(f+5)).value='Sel HM AKHIR kuning = akhir shift';ws.getCell('H'+(f+3)).value='HM SERVICE';ws.getCell('I'+(f+3)).value={formula:`I${f+2}-I${f+1}`};
   ws.columns=[{width:3},{width:6},{width:11},{width:13},{width:11},{width:11},{width:14},{width:11},{width:14},{width:11},{width:9},{width:48},{width:20},{width:14},{width:18}]
  });
  const bf=await wb.xlsx.writeBuffer();
  const u=URL.createObjectURL(new Blob([bf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  const a=document.createElement('a');
  const safeName=m.n.replace(/[\\/:*?"<>|]+/g,'_');
  a.href=u;a.download='Monitoring HM '+safeName+'.xlsx';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);
 }catch(e){alert('Gagal unduh: '+(e.message||e))}
}

const FBU='https://www.gstatic.com/firebasejs/10.14.1/';
async function connectDB(){
 if(window.__DBMOCK)return window.__DBMOCK;
 let C={};try{C=JSON.parse(localStorage.getItem('jmcfg')||'{}')}catch(e){}
 if(!C.firebase||!C.firebase.apiKey)throw new Error('Firebase belum tersambung di perangkat ini. <a href="sambungkan.html">Sambungkan perangkat ini</a>');
 const[A,F,U]=await Promise.all([import(FBU+'firebase-app.js'),import(FBU+'firebase-firestore.js'),import(FBU+'firebase-auth.js')]);
 const ap=A.initializeApp(C.firebase),db=F.getFirestore(ap),au=U.getAuth(ap);
 await new Promise(res=>U.onAuthStateChanged(au,u=>{if(u)res();else{document.getElementById('app').innerHTML='<div class="card" style="max-width:420px;margin:30px auto"><b>Masuk</b><label>Email</label><input id="lgE" type="email"><label>Password</label><input id="lgP" type="password"><button class="btn" id="lgB">Masuk</button><p id="lgM" class="mu"></p></div>';
  document.getElementById('lgB').onclick=async()=>{try{await U.signInWithEmailAndPassword(au,document.getElementById('lgE').value.trim(),document.getElementById('lgP').value)}catch(x){document.getElementById('lgM').textContent='Email atau password salah.'}}}}));
 const rs=await F.getDoc(F.doc(db,'users',au.currentUser.uid));
 return{role:rs.exists()?rs.data().role:null,
  loadAll:async()=>{const g=async c=>(await F.getDocs(F.collection(db,c))).docs.map(d=>({id:d.id,...d.data()}));const[alat,bulan]=await Promise.all([g('alat'),g('alat_bulan')]);return{alat,bulan}},
  save:async(sets,dels)=>{const all=[...sets.map(s=>['s',...s]),...dels.map(d=>['d',...d])];for(let k=0;k<all.length;k+=400){const b=F.writeBatch(db);all.slice(k,k+400).forEach(x=>x[0]==='s'?b.set(F.doc(db,x[1],x[2]),x[3]):b.delete(F.doc(db,x[1],x[2])));await b.commit()}}}}
(async()=>{try{document.getElementById('app').innerHTML='<p class="mu" style="padding:20px">Memuat data...</p>';
 DBX=await connectDB();canEdit=DBX.role==='admin';applyData(await DBX.loadAll());render()}
 catch(e){document.getElementById('app').innerHTML='<div class="card" style="max-width:520px;margin:30px auto"><b>Gagal memuat</b><p class="mu">'+(e.message||e)+'</p></div>'}})();
</script>
