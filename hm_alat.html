<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HM Alat Berat dan Kendaraan</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff;--fg:#1a1a1a;--mu:#667;--bd:#d9dce1;--ac:#1f3864;--acf:#fff;--sf:#f3f4f7;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16181d;--fg:#ececec;--mu:#9aa3b0;--bd:#333945;--ac:#7aa2f7;--acf:#10131a;--sf:#20242c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16181d;--fg:#ececec;--mu:#9aa3b0;--bd:#333945;--ac:#7aa2f7;--acf:#10131a;--sf:#20242c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
#app{max-width:1000px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 10px}
h2{font-size:15px;margin:16px 0 8px}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px}
.tabs button{flex:none;padding:8px 12px;border:1px solid var(--bd);background:var(--sf);color:var(--fg);border-radius:8px;font:inherit;font-size:13px;cursor:pointer}
.tabs button.on{background:var(--ac);color:var(--acf);border-color:var(--ac)}
.card{border:1px solid var(--bd);border-radius:10px;padding:12px;background:var(--sf)}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
input,select,textarea{width:100%;box-sizing:border-box;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
.btn{margin-top:12px;padding:10px 16px;border:0;border-radius:8px;background:var(--ac);color:var(--acf);font:inherit;font-weight:600;width:100%;cursor:pointer}
.btn.s{background:var(--sf);color:var(--fg);border:1px solid var(--bd);margin-top:8px}
.jobs{display:flex;flex-wrap:wrap;gap:8px}
.jobs label{display:flex;align-items:center;gap:6px;margin:0;padding:7px 10px;border:1px solid var(--bd);border-radius:8px;color:var(--fg);font-size:14px;width:auto;cursor:pointer}
.jobs input{width:auto}
.w{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:5px 7px;border:1px solid var(--bd);text-align:right;white-space:nowrap}
th{background:var(--ac);color:var(--acf);white-space:normal}
td.l,th.l{text-align:left;white-space:normal}
tr.t td{font-weight:700;background:var(--sf)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.mu{color:var(--mu);font-size:12px}
.x{border:0;background:none;color:#d33;font-size:16px;cursor:pointer}
.topbar{position:fixed;right:10px;top:6px;font:13px system-ui;z-index:5;display:flex;gap:10px;background:var(--sf);border:1px solid var(--bd);padding:3px 8px;border-radius:6px}
.topbar a{color:var(--ac);text-decoration:none}
</style>
</head>
<body>
<div class="topbar"><a href="menu.html">Menu</a><span id="sync"></span></div>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script>
let S={machines:[],logs:[],solar:{},service:[]},DBX=null,canEdit=false,tab='rk',mon=new Date().toISOString().slice(0,7),rf='',rt='',ed=-1,hf='';
const LW={'Evakuasi Jangkos':40,'Langsir Cangkang':25,'Evakuasi Solid':20,'Langsir Kernel':5,'Langsir Kalsium':4,'Evakuasi Buah':3,'Other':3},
      DEF={'Loader xc938':LW,'Loader Lw300kn':{'Evakuasi Buah':70,'Evakuasi Jangkos':5,'Evakuasi Solid':5,'Langsir Cangkang':5,'Langsir Kernel':5,'Langsir Kalsium':5,'Other':5},'Excavator xe135b':{'Evakuasi Jangkos':40,'Evakuasi Cangkang':25,'Evakuasi Solid':20,'Other':15}};
S.machines.forEach(m=>{if(!m.w)m.w=DEF[m.n]||{}});
S.service=S.service||[];
try{const u=JSON.parse(sessionStorage.getItem('hm_ui')||'{}');tab=u.tab||tab;mon=u.mon||mon;hf=u.hf||hf;rf=u.rf||rf;rt=u.rt||rt}catch(e){}

const $=s=>document.querySelector(s),
      HARI=['Minggu','Senin','Selasa','Rabu','Kamis',"Jum'at",'Sabtu'],
      BLN=['JAN','FEB','MAR','APRIL','MEI','JUNI','JULI','AGUST','SEPT','OKT','NOV','DES'],
      esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
      r1=v=>Math.round((+v||0)*10)/10,
      n=(v,d=1)=>(+v).toLocaleString('en-US',{useGrouping:false,minimumFractionDigits:d,maximumFractionDigits:2}),
      mach=m=>S.machines.find(x=>x.n===m),
      sorted=m=>S.logs.map((l,i)=>({...l,i})).filter(l=>l.m===m).sort((a,b)=>a.d.localeCompare(b.d)||a.i-b.i);

function shares(m,ks,tot){
  const mc=mach(m),ws=mc.w||{},fx=mc.fx||{},avg=mc.jobs.length?100/mc.jobs.length:1,T=tot>0?tot:0;
  if(!T)return ks.map(()=>1/ks.length);
  const isF=ks.map(k=>fx[k]!==undefined),
        fs=ks.map((k,i)=>isF[i]?Math.min(+fx[k],T):0),
        fsum=fs.reduce((a,b)=>a+b,0),
        w=ks.map((k,i)=>isF[i]?0:(ws[k]!==undefined?+ws[k]:(ws['Other']!==undefined?+ws['Other']:avg))),
        wt=w.reduce((a,b)=>a+b,0);
  return ks.map((k,i)=>isF[i]?fs[i]/T:(wt>0?(T-fsum)/T*w[i]/wt:0));
}

function startHM(m){
  const L=sorted(m);
  return L.length?+L[L.length-1].hm:+mach(m).hm;
}

function build(m,mo){
  const mc=mach(m),L=sorted(m);
  let hm=+mc.hm,hs=+mc.hm,J=+mc.solar0;
  const p=mo+'-01';
  L.filter(l=>l.d<p).forEach(l=>{hs=r1(hs+r1(l.hm-hm));hm=+l.hm});
  Object.keys(S.solar).forEach(k=>{const[a,d]=k.split('|');if(a===m&&d<p)J+=S.solar[k]});
  const inM=L.filter(l=>l.d.startsWith(mo)),
        solDays=Object.keys(S.solar).filter(k=>k.startsWith(m+'|'+mo)).map(k=>+k.slice(m.length+9));
  if(!inM.length&&!solDays.length)return[];
  const last=Math.max(inM.length?+inM[inM.length-1].d.slice(8):0,...solDays),
        [y,mm]=mo.split('-').map(Number),
        out=[];
  for(let day=1;day<=last;day++){
    const d=mo+'-'+String(day).padStart(2,'0'),
          ls=inM.filter(l=>l.d===d),
          sol=S.solar[m+'|'+d]||0;
    J+=sol;
    const rs=ls.length?ls:[{hm,ket:''}];
    rs.forEach((l,k)=>{
      const s=hm;
      hm=+l.hm;
      const g=r1(hm-s);
      hs=r1(hs+g);
      out.push({day,y,mm,hari:HARI[new Date(y,mm-1,day).getDay()],s,f:hm,g,hs,sol:k?null:sol,J:k?null:J,ket:l.ket||'',op:l.op||'',sf:l.sf||0,jo:l.jo||0,ja:l.ja||'',jb:l.jb||'',first:!k,cnt:rs.length,i:l.i});
    });
  }
  return out;
}

const MID={},SNAP={};
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const clean=o=>JSON.parse(JSON.stringify(o));

function payloads(){
  const P={},machMap={};
  S.machines.forEach((m,i)=>{if(!MID[m.n])MID[m.n]=slug(m.n);machMap[MID[m.n]]={...clean(m),id:MID[m.n],urut:i}});
  const get=(n,mo)=>{const id=MID[n]||(MID[n]=slug(n)),k=id+'_'+mo;return P[k]||(P[k]={id:k,mesin_id:id,bulan:mo,logs:[],solar:{},service:[]})};
  S.logs.forEach(l=>{const{m,...r}=l;get(m,l.d.slice(0,7)).logs.push(clean(r))});
  Object.keys(S.solar).forEach(k=>{const[n,d]=k.split('|');if(MID[n]!==undefined||S.machines.some(x=>x.n===n))get(n,d.slice(0,7)).solar[d]=S.solar[k]});
  (S.service||[]).forEach(s=>get(s.m,s.d.slice(0,7)).service.push(clean(s)));
  return{P,mach:machMap};
}

function status(t,er){
  const e=document.getElementById('sync');
  if(e){e.textContent=t;e.style.color=er?'#b3261e':'#2a7048'}
}

let busy=Promise.resolve();
function commit(){busy=busy.then(commitNow);return busy}

async function commitNow(){
  if(!canEdit){alert('Kamu tidak punya izin mengubah data.');return}
  try{
    status('Menyimpan...');
    const{P,mach:machMap}=payloads(),sets=[],dels=[];
    Object.entries(machMap).forEach(([id,d])=>{const j=JSON.stringify(d);if(SNAP['alat/'+id]!==j)sets.push(['alat',id,d,j])});
    Object.entries(P).forEach(([id,d])=>{
      const empty=!d.logs.length&&!Object.keys(d.solar).length&&!d.service.length,j=JSON.stringify(d);
      if(empty){if(SNAP['alat_bulan/'+id]!==undefined)dels.push(['alat_bulan',id])}
      else if(SNAP['alat_bulan/'+id]!==j)sets.push(['alat_bulan',id,d,j]);
    });
    Object.keys(SNAP).filter(k=>k.startsWith('alat_bulan/')&&!P[k.slice(11)]).forEach(k=>dels.push(['alat_bulan',k.slice(11)]));
    if(sets.length||dels.length)await DBX.save(sets.map(s=>s.slice(0,3)),dels);
    sets.forEach(s=>SNAP[s[0]+'/'+s[1]]=s[3]);
    dels.forEach(d=>delete SNAP[d[0]+'/'+d[1]]);
    status('Tersimpan '+new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}));
  }catch(e){
    status('Gagal menyimpan',1);
    alert('Gagal menyimpan: '+(e.message||e));
  }
}

function applyData(D){
  S={machines:[],logs:[],solar:{},service:[]};
  D.alat.sort((a,b)=>(a.urut||0)-(b.urut||0)).forEach(a=>{
    const{id,urut,...m}=a;
    MID[m.n]=id;
    S.machines.push(m);
    SNAP['alat/'+id]=JSON.stringify({...clean(m),id,urut});
  });
  const nm={};Object.entries(MID).forEach(([n,id])=>nm[id]=n);
  const order=Object.fromEntries(D.alat.map((a,i)=>[a.id,i]));
  D.bulan.sort((a,b)=>a.bulan<b.bulan?-1:a.bulan>b.bulan?1:(order[a.mesin_id]||0)-(order[b.mesin_id]||0)).forEach(b=>{
    const n=nm[b.mesin_id];if(!n)return;
    SNAP['alat_bulan/'+b.id]=JSON.stringify({id:b.id,mesin_id:b.mesin_id,bulan:b.bulan,logs:b.logs||[],solar:b.solar||{},service:b.service||[]});
    (b.logs||[]).forEach(l=>S.logs.push({...l,m:n}));
    Object.entries(b.solar||{}).forEach(([d,v])=>S.solar[n+'|'+d]=v);
    (b.service||[]).forEach(s=>S.service.push(s));
  });
}

function rekap(){
  const inRange=d=>(!rf||d>=rf)&&(!rt||d<=rt);
  return `<h2>Ringkasan semua mesin</h2>
  <div class="row2"><div><label>Dari tanggal</label><input type="date" value="${esc(rf)}" onchange="rf=this.value;render()"></div><div><label>Sampai tanggal</label><input type="date" value="${esc(rt)}" onchange="rt=this.value;render()"></div></div>
  <div class="w" style="margin-top:10px"><table><tr><th class="l">Mesin</th><th>Hari</th><th>HM Pemakaian</th><th>Isi Solar (L)</th><th>HM Terakhir</th><th>HM Service</th></tr>
  ${S.machines.map(m=>{
    const ls=sorted(m.n);
    let prev=+m.hm,tot=0;
    const days=new Set();
    ls.forEach(l=>{if(inRange(l.d)){tot=r1(tot+r1(l.hm-prev));days.add(l.d)}prev=+l.hm});
    const sol=Object.keys(S.solar).filter(k=>k.split('|')[0]===m.n&&inRange(k.split('|')[1])).reduce((a,k)=>a+S.solar[k],0);
    const sb=svcBase(m.n);
    return `<tr><td class="l">${esc(m.n)}</td><td>${days.size}</td><td>${n(tot)}</td><td>${n(sol,0)}</td><td>${n(startHM(m.n))}</td><td>${sb?n(r1(startHM(m.n)-sb)):'-'}</td></tr>`;
  }).join('')}</table></div>
  <p class="mu">Detail harian dan rekap per kegiatan ada di tab tiap mesin. HM Service dihitung dari service terakhir yang dicatat (atau HM baru ganti di tab Master kalau belum ada).</p>${svcAll()}`;
}

function mesin(mi){
  const m=S.machines[mi],R=build(m.n,mon);
  let sol=0;
  R.forEach(r=>{if(r.first)sol+=r.sol});
  const by={},bj={};R.forEach(r=>{const k=(r.ket||'-').trim();by[k]=r1((by[k]||0)+r.g);bj[k]=(bj[k]||0)+r.jo});
  const bo={},boj={};R.forEach(r=>{const k=(r.op||'-').trim();bo[k]=r1((bo[k]||0)+r.g);boj[k]=(boj[k]||0)+r.jo});
  return `<h2>Monitoring HM ${esc(m.n)}</h2>
  <div class="row2"><div><label>Bulan</label><input type="month" value="${esc(mon)}" onchange="if(this.value){mon=this.value;render()}"></div><div style="align-self:end"><button class="btn s" style="margin:0" onclick="exp(${mi})">Unduh Excel</button></div></div>
  <div class="w" style="margin-top:10px"><table><tr><th>No</th><th>Hari</th><th>Tgl</th><th>HM Awal</th><th>HM Akhir</th><th>HM Pemakaian</th><th>HM SHI</th><th>Isi Solar (L)</th><th>SHI (L)</th><th>L/HM</th><th class="l">Keterangan</th><th class="l">Operator</th><th>Jam Operator</th></tr>
  ${R.map(r=>`<tr><td>${r.first?r.day:''}</td><td>${r.first?esc(r.hari):''}</td><td>${r.first?r.day+'/'+r.mm:''}</td><td>${n(r.s)}</td><td${r.sf?' style="background:#ffe699;color:#000;font-weight:700"':''}>${n(r.f)}${r.sf?' ⇄':''}</td><td>${n(r.g)}</td><td>${n(r.hs)}</td><td>${r.first?n(r.sol,0):''}</td><td>${r.first?n(r.J):''}</td><td>${r.first&&r.hs?n(r.J/r.hs,2):''}</td><td class="l">${esc(r.ket)}</td><td class="l">${esc(r.op)}</td><td>${r.ja?esc(r.ja)+'–'+esc(r.jb)+' ('+n(r.jo)+')':(r.jo?n(r.jo):'')}</td></tr>`).join('')||'<tr><td colspan="13" class="l">Belum ada data bulan ini.</td></tr>'}
  <tr class="t"><td colspan="5" class="l">TOTAL</td><td>${n(R.reduce((a,r)=>r1(a+r.g),0))}</td><td></td><td>${n(sol,0)}</td><td colspan="4"></td><td>${n(R.reduce((a,r)=>a+r.jo,0))}</td></tr></table></div>
  <p class="mu">⇄ (sel kuning) = HM akhir shift / pergantian operator</p>${svcOne(m.n)}
  <h2>Jam per kegiatan (Keterangan)</h2><div class="w"><table><tr><th class="l">Kegiatan</th><th>Jam HM</th><th>Jam Operator</th></tr>${Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td class="l">${esc(k)}</td><td>${n(v)}</td><td>${n(bj[k]||0)}</td></tr>`).join('')||'<tr><td class="l" colspan="3">-</td></tr>'}</table></div>
  <h2>Jam per operator</h2><div class="w"><table><tr><th class="l">Operator</th><th>Jam HM</th><th>Jam Kerja Operator</th></tr>${Object.entries(bo).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td class="l">${esc(k)}</td><td>${n(v)}</td><td>${n(boj[k]||0)}</td></tr>`).join('')||'<tr><td class="l" colspan="3">-</td></tr>'}</table></div>`;
}

let eg=null,GC=[];
const gkey=l=>l.sid||(l.m+'|'+l.d+'|'+(l.op||''));
function groups(){
  const g=new Map();
  S.logs.forEach((l,i)=>{const k=gkey(l);if(!g.has(k))g.set(k,{k,m:l.m,d:l.d,op:l.op||'',idx:[]});g.get(k).idx.push(i)});
  return[...g.values()].sort((a,b)=>b.d.localeCompare(a.d)||b.idx[0]-a.idx[0]);
}
function stAt(m,d,ex){
  const mi=ex&&ex.length?Math.min(...ex):1e9;
  const L=sorted(m).filter(l=>!(ex&&ex.includes(l.i))&&(l.d<d||(l.d===d&&l.i<mi)));
  return r1(L.length?+L[L.length-1].hm:+mach(m).hm);
}
function nxHM(m,d,ex){
  const mi=ex&&ex.length?Math.min(...ex):-1;
  const L=sorted(m).filter(l=>!(ex&&ex.includes(l.i))&&(l.d>d||(mi>=0&&l.d===d&&l.i>mi)));
  return L.length?r1(+L[0].hm):Infinity;
}
function chainMap(){
  const C={};
  S.machines.forEach(mc=>{let p=r1(+mc.hm);sorted(mc.n).forEach(l=>{const h=r1(+l.hm-p);C[l.i]={...l,s:p,h};p=r1(+l.hm)})});
  return C;
}

function inputTab(){
  const C=chainMap();
  GC=groups().filter(g=>!hf||g.d.startsWith(hf));
  if(!hf)GC=GC.slice(0,60);
  const sk=Object.keys(S.solar).map(k=>({k,m:k.split('|')[0],d:k.split('|')[1],v:S.solar[k]})).filter(x=>!hf||x.d.startsWith(hf)).sort((a,b)=>b.d.localeCompare(a.d)).slice(0,hf?400:60);
  const form=canEdit?`<div class="card">
    ${ed>=0?'<p class="mu"><b>Mengedit shift ('+eg.length+' baris).</b> HM tiap job dipertahankan kalau job dan HM Akhir tidak diubah; kalau diubah, HM dibagi ulang sesuai porsi.</p>':''}
    <div class="row2">
      <div><label>Tanggal (boleh tanggal yang sudah lewat)</label><input type="date" id="fd" value="${new Date().toISOString().slice(0,10)}" onchange="jt();prev()"></div>
      <div><label>Mesin</label><select id="fm" onchange="onMachChange()">${S.machines.map(m=>`<option>${esc(m.n)}</option>`).join('')}</select></div>
    </div>
    <label>Nama operator (jika diisi, HM Akhir ditandai akhir shift)</label>
    <input id="fo" list="dop" autocomplete="off" placeholder="nama operator">
    <datalist id="dop">${[...new Set(S.logs.map(l=>l.op).filter(Boolean))].map(o=>`<option value="${esc(o)}">`).join('')}</datalist>
    <label>HM Akhir</label>
    <input type="text" inputmode="decimal" id="fh" autocomplete="off" placeholder="contoh 10637.6" oninput="d1(this);onHM()">
    <p class="mu" id="pv"></p>
    <label>Job yang dikerjakan</label>
    <div class="jobs" id="jb"></div>
    <label>Kegiatan lain (opsional, pisahkan dengan koma)</label>
    <input id="fk" list="dj" autocomplete="off" oninput="jt();prev()" placeholder="ketik kegiatan">
    <datalist id="dj"></datalist>
    <div id="jt"></div>
    <label>Isi Solar (L) – opsional, sekali per hari</label>
    <input type="number" step="0.1" inputmode="decimal" id="fs">
    <button class="btn" onclick="add()">${ed>=0?'Simpan perubahan':'Simpan data'}</button>
    ${ed>=0?'<button class="btn s" onclick="ed=-1;eg=null;HMJ={};JT={};ORD=[];HDIRTY=false;render()">Batal edit</button>':'<button class="btn s" onclick="off()">Hari libur (Off)</button>'}
  </div>`:`<p class="mu">Mode lihat saja: hanya pemilik/editor yang bisa menginput data.</p>`;

  const rows=GC.map((g,gi)=>{
    const rs=g.idx.map(i=>C[i]),f=rs[0],e=rs[rs.length-1],hmT=rs.reduce((a,r)=>r1(a+r.h),0),jo=rs.reduce((a,r)=>a+(r.jo||0),0),ja=(rs.find(r=>r.ja)||{}).ja,jb=[...rs].reverse().map(r=>r.jb).find(Boolean),sf=rs.some(r=>r.sf);
    return `<tr><td>${esc(g.d)}</td><td class="l">${esc(g.m)}</td><td class="l">${esc(g.op)}</td><td>${n(f.s)} → ${n(e.hm)}${sf?' ⇄':''}</td><td>${n(hmT)}</td><td class="l">${esc(rs.map(r=>r.ket||'-').join(', '))}</td><td>${ja?esc(ja)+'–'+esc(jb)+' ('+n(jo)+')':(jo?n(jo):'')}</td>${canEdit?`<td><button class="x" onclick="editG(${gi})">✎</button><button class="x" onclick="delG(${gi})">✕</button></td>`:''}</tr>`;
  }).join('')||'<tr><td colspan="8" class="l">Belum ada data.</td></tr>';

  return form+svcForm()+`<h2>Riwayat input per shift</h2>
  <label>Bulan (kosongkan = 60 terbaru)</label>
  <input type="month" value="${esc(hf)}" onchange="hf=this.value;render()">
  <div class="w"><table><tr><th>Tanggal</th><th class="l">Mesin</th><th class="l">Operator</th><th>HM Awal → Akhir</th><th>HM Pemakaian</th><th class="l">Kegiatan</th><th>Jam Operator</th>${canEdit?'<th></th>':''}</tr>${rows}</table></div>
  <h2>Isi solar tercatat</h2>

function jobsSel(){

function mv(i,d){
  const js=jobsSel(),j=i+d;
  if(j<0||j>=js.length)return;
  const all=js.every(x=>(JT[x]||{}).a&&(JT[x]||{}).b),dm={};
  js.forEach(x=>dm[x]=dur((JT[x]||{}).a,(JT[x]||{}).b));
  const st=all?tmin(JT[js[0]].a):null;
  [js[i],js[j]]=[js[j],js[i]];
  ORD=js;
  if(all){let c=st;js.forEach(x=>{const e=c+Math.round(dm[x]*60);JT[x]={a:hhmm(c),b:hhmm(e)};c=e})}
  jt();prev();

function d1(e){
  let v=e.value.replace(',','.').replace(/[^0-9.]/g,'');
  const p=v.split('.');
  v=p[0]+(p.length>1?'.'+p.slice(1).join('').slice(0,1):'');

}

  dlist();jt();prev();
}

let JT={},HMJ={},HDIRTY=false,ORD=[];
const tmin=x=>{const p=(x||'').split(':');return p.length<2||!p[0]?null:+p[0]*60+ +p[1]};
function dur(a,b){const x=tmin(a),y=tmin(b);return x===null||y===null?0:Math.round(((y-x+1440)%1440)/60*100)/100}
let SH={a:'',b:''};
const hhmm=m=>{m=((Math.round(m)%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};

function plan(m,k,tot){
  const T=Math.max(r1(tot),0),
        man=k.map(j=>HMJ[j]!==undefined&&HMJ[j]!==''&&!isNaN(HMJ[j])),
        ms=k.reduce((a,j,i)=>r1(a+(man[i]?r1(+HMJ[j]):0)),0),
        rest=k.filter((j,i)=>!man[i]),
        rem=Math.max(r1(T-ms),0),
        sh=rest.length?shares(m,rest,rem):[];
  let r=0;
  const a=sh.map(x=>r1(x*rem));
  if(a.length){
    const dl=r1(rem-a.reduce((p,x)=>r1(p+x),0));
    a[a.length-1]=Math.max(0,r1(a[a.length-1]+dl));
  }
  return k.map((j,i)=>man[i]?r1(+HMJ[j]):a[r++]);
}

function setHM(i,v,live){
  const j=jobsSel().filter(Boolean)[i];
  if(!j)return;
  if(v==='')delete HMJ[j];
  else HMJ[j]=Math.max(0,r1(parseFloat(v)));
  HDIRTY=true;
  if(!live)jt();
  prev();
}

function resetHM(){HMJ={};HDIRTY=false;jt();prev()}
function onHM(){if(!HDIRTY)HMJ={};jt();prev()}

function jt(){
  const el=$('#jt');if(!el)return;
  const js=jobsSel().filter(Boolean);
  const m=$('#fm').value,hv=parseFloat($('#fh').value),tot=isNaN(hv)?0:r1(hv-stAt(m,$('#fd').value,ed>=0?eg:null)),pl=plan(m,js,tot);
  el.innerHTML=js.length?`<label>Jam shift operator (jam dunia, opsional)</label>
  <div class="row2"><input type="time" value="${esc(SH.a)}" onchange="SH.a=this.value"><input type="time" value="${esc(SH.b)}" onchange="SH.b=this.value"></div>
  <button class="btn s" onclick="autoJT()">Bagi otomatis jam ke job sesuai porsi</button>
  <label>Per job: jam kerja operator dan HM mesin (HM terisi otomatis sesuai porsi, bisa diubah). Urutan job = urutan jam kerja, tukar dengan tombol ▲ ▼.</label>`+
  js.map((j,i)=>{
    const t=JT[j]||{};
    return `<div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px"><b>${i+1}. ${esc(j)}</b><span><button class="x" ${i?'':'disabled'} onclick="mv(${i},-1)" aria-label="Naikkan urutan">▲</button><button class="x" ${i<js.length-1?'':'disabled'} onclick="mv(${i},1)" aria-label="Turunkan urutan">▼</button></span></div>
    <div class="row3"><div><label>dari jam</label><input type="time" value="${esc(t.a||'')}" onchange="setJT(${i},'a',this.value)"></div><div><label>sampai jam</label><input type="time" value="${esc(t.b||'')}" onchange="setJT(${i},'b',this.value)"></div><div><label>HM</label><input type="number" step="0.1" min="0" inputmode="decimal" value="${pl[i]}" oninput="setHM(${i},this.value,true)" onchange="setHM(${i},this.value,false)"></div></div>`;
  }).join('')+`<button class="btn s" onclick="resetHM()">Hitung ulang HM otomatis</button>`:'';
}

function autoJT(){
  const js=jobsSel().filter(Boolean),x=tmin(SH.a),y=tmin(SH.b);
  if(x===null||y===null||!js.length){alert('Isi jam shift dari dan sampai dulu.');return}
  const tot=(y-x+1440)%1440;
  if(!tot){alert('Jam dari dan sampai tidak boleh sama.');return}
  const sh=shares($('#fm').value,js,tot/60);
  let c=x,cum=0;
  const k=js.length,b=[];
  js.forEach((j,i)=>{if(i<k-1){cum+=sh[i];b.push(Math.round((x+tot*cum)/30)*30)}});
  if(tot>=30*k)b.forEach((v,i)=>{const lo=(i?b[i-1]:x)+30,hi=x+tot-30*(k-1-i);b[i]=Math.min(Math.max(v,lo),hi)});
  js.forEach((j,i)=>{const e=i===k-1?x+tot:b[i];JT[j]={a:hhmm(c),b:hhmm(e)};c=e});
  jt();prev();
}

function setJT(i,k,v){const j=jobsSel().filter(Boolean)[i];if(j)(JT[j]=JT[j]||{})[k]=v;prev()}

function prev(){
  const m=$('#fm').value,s=stAt(m,$('#fd').value,ed>=0?eg:null),h=parseFloat($('#fh').value),tot=isNaN(h)?NaN:r1(h-s);
  $('#pv').textContent='HM Awal: '+n(s)+(isNaN(h)?'':'  •  HM pemakaian: '+n(tot)+(jobsSel().length?'  •  '+(()=>{
    const k=jobsSel(),pl=plan(m,k,tot),sm=pl.reduce((a,b)=>r1(a+b),0);
    return k.map((j,i)=>{const t=JT[j]||{},d=dur(t.a,t.b);return j+' '+n(pl[i],1)+(d?' (op '+n(d)+' jam)':'')}).join(' • ')+(Math.abs(sm-tot)>0.06?'  ⚠ jumlah HM job '+n(sm,1)+' ≠ '+n(tot,1):'');
  })():''));
}

function save(m,d,h,ks,sol){
  const op=($('#fo')?$('#fo').value:'').trim();
  if(!d||isNaN(h)){alert('Isi tanggal dan HM Akhir.');return false}
  const isOff=ks.length===1&&ks[0]==='Off';
  if(!isOff&&Math.abs(h*10-Math.round(h*10))>1e-6){alert('HM Akhir hanya boleh 1 angka di belakang koma.');return false}
  h=r1(h);
  const ex=ed>=0?eg:null,st=stAt(m,d,ex),nx=nxHM(m,d,ex);
  if(h<st-1e-6){alert('HM Akhir lebih kecil dari HM Awal ('+n(st)+') pada tanggal itu.');return false}
  if(h>nx+1e-6){alert('HM Akhir lebih besar dari HM sesudahnya ('+n(nx)+'). Cek tanggal atau HM-nya.');return false}
  const c=ks.length,tot=r1(h-st),pl=plan(m,ks,tot),sid=(ex&&S.logs[eg[0]].sid)||'s'+Date.now(),sm=pl.reduce((a,b)=>r1(a+b),0);
  if(Math.abs(sm-tot)>0.06){alert('Jumlah HM per job ('+n(sm,1)+') tidak sama dengan HM pemakaian ('+n(tot,1)+'). Cek isian HM tiap job atau klik "Hitung ulang HM otomatis".');return false}
  let cum=0;
  const nr=ks.map((j,i)=>{
    cum=r1(cum+pl[i]);
    const t=JT[String(j).trim()]||{};
    return{d,m,hm:i===c-1?h:r1(st+cum),ket:String(j).trim(),op,sf:(i===c-1&&op)?1:0,jo:dur(t.a,t.b),ja:t.a||'',jb:t.b||'',sid};
  });
  if(ex){
    const old=ex.map(i=>S.logs[i]);
    const ou=new Set(old.map(o=>o.ket)),same=ou.size===c&&ks.every(k=>ou.has(String(k).trim()))&&old[0].d===d&&old[0].m===m&&Math.abs(old[old.length-1].hm-h)<1e-6&&!HDIRTY,seen=new Set();
    const rn=same?old.map((o,k)=>{const f=!seen.has(o.ket);seen.add(o.ket);const r=nr.find(r=>r.ket===o.ket);return{...r,hm:o.hm,sf:(k===old.length-1&&op)?1:0,jo:f?r.jo:0,ja:f?r.ja:'',jb:f?r.jb:''}}):nr,pos=Math.min(...ex),out=[];
    S.logs.forEach((l,i)=>{if(i===pos)rn.forEach(r=>out.push(r));if(!ex.includes(i))out.push(l)});
    S.logs=out;ed=-1;eg=null;
  }else nr.forEach(r=>S.logs.push(r));
  if(!isNaN(sol))S.solar[m+'|'+d]=sol;
  commit();
  return true;
}

    const ws=wb.addWorksheet(sheetName),
          H=['NO','HARI','TGL/BLN/TH','HM AWAL','HM AKHIR','HM PEMAKAIAN','HM SHI','ISI SOLAR ( L )','SHI ( L )','L/HM','KETERANGAN','OPERATOR','JAM KERJA OPERATOR','JAM DARI-SAMPAI'];
    ws.mergeCells('B1:O1');
    const t=ws.getCell('B1');t.value='Monitoring HM '+m.n;t.font={bold:true,size:14};t.alignment={horizontal:'center'};
    H.forEach((h,i)=>{const c=ws.getCell(2,i+2);c.value=h;c.font={bold:true,color:{argb:'FFFFFFFF'}};c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF1F3864'}};c.alignment={horizontal:'center',vertical:'middle',wrapText:true};c.border=bd});
    const hs0=r1(R[0].hs-R[0].g),J0=R[0].J-R[0].sol;
    let pf=0,fx=0;
    R.forEach((r,i)=>{
      const x=i+3,p=x-1,set=(c,v)=>{ws.getCell(c+x).value=v};
      set('E',i?{formula:'F'+p,result:r.s}:r.s);
      set('F',r.f);
      if(r.sf){const q=ws.getCell('F'+x);q.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFFFE699'}};q.font={bold:true}}
      set('G',{formula:`F${x}-E${x}`,result:r.g});
      set('H',{formula:(i?`H${p}`:hs0)+`+G${x}`,result:r.hs});
      set('L',r.ket);set('M',r.op||'');set('O',r.ja?r.ja+'-'+r.jb:'');set('N',r.jo||0);
      if(r.first){
        set('B',r.day);set('C',r.hari);set('D',new Date(Date.UTC(r.y,r.mm-1,r.day)));set('I',r.sol);
        set('J',{formula:pf?`J${pf}+I${x}`:`I${x}+${J0}`,result:r.J});
        set('K',{formula:`J${x}/H${x}`,result:r.hs?r.J/r.hs:0});
        pf=x;
        if(r.cnt>1)['B','C','D','I','J','K'].forEach(c=>ws.mergeCells(`${c}${x}:${c}${x+r.cnt-1}`));
      }
      fx=x;
    });
    for(let x=3;x<=fx;x++)for(let c=2;c<=15;c++){
      const cl=ws.getCell(x,c);
      cl.border=bd;
      cl.alignment={vertical:'middle',horizontal:(c===12||c===13)?'left':'center',wrapText:(c===12||c===13)};
      if([5,6,7,8,10,14].includes(c))cl.numFmt='0.0';
      if(c===4)cl.numFmt='dd/mm/yyyy';
      if(c===11)cl.numFmt='0.00';
    }
    const f=fx+2;
    ws.getCell('H'+f).value='TOTAL SOLAR (L)';ws.getCell('I'+f).value={formula:`SUM(I3:I${fx})`};
    ws.getCell('H'+(f+1)).value='HM BARU GANTI';ws.getCell('I'+(f+1)).value=svcBase(m.n);
    ws.getCell('H'+(f+2)).value='HM SEKARANG';ws.getCell('I'+(f+2)).value={formula:'F'+fx,result:R[R.length-1].f};
    ws.getCell('H'+(f+5)).value='Sel HM AKHIR kuning = akhir shift';
    ws.getCell('H'+(f+3)).value='HM SERVICE';ws.getCell('I'+(f+3)).value={formula:`I${f+2}-I${f+1}`};
    ws.columns=[{width:3},{width:6},{width:11},{width:13},{width:11},{width:11},{width:14},{width:11},{width:14},{width:11},{width:9},{width:48},{width:20},{width:14},{width:18}];
  });
  try{
    const bf=await wb.xlsx.writeBuffer(),
          u=URL.createObjectURL(new Blob([bf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})),
          a=document.createElement('a'),
          safeName=m.n.replace(/[\\/:*?"<>|]+/g,'_');
    a.href=u;a.download='Monitoring HM '+safeName+'.xlsx';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),4000);
  }catch(e){alert('Gagal unduh: '+(e.message||e))}
}

function render(){
  if(tab!=='in'){HMJ={};JT={};ORD=[];HDIRTY=false}
  try{sessionStorage.setItem('hm_ui',JSON.stringify({tab,mon,hf,rf,rt}))}catch(e){}
  const T=[['rk','Rekap'],['in','Input'],...S.machines.map((m,i)=>['m'+i,m.n]),['ms','Master']];
  $('#app').innerHTML=`<h1>Monitoring Hour Meter</h1><div class="tabs">${T.map(t=>`<button class="${t[0]===tab?'on':''}" onclick="tab='${t[0]}';ed=-1;render()">${esc(t[1])}</button>`).join('')}</div>`+
  (tab==='rk'?rekap():tab==='in'?inputTab():tab==='ms'?masterTab():mesin(+tab.slice(1)));
  if(tab==='in'&&canEdit){dlist();jt();prev();svcFill()}
}

const FBU='https://www.gstatic.com/firebasejs/10.14.1/';
async function connectDB(){
  if(window.__DBMOCK)return window.__DBMOCK;
  let C={};try{C=JSON.parse(localStorage.getItem('jmcfg')||'{}')}catch(e){}
  if(!C.firebase||!C.firebase.apiKey)throw new Error('Firebase belum tersambung. Buka halaman rekap, isi Sambungan, lalu buka halaman ini lagi.');
  const[A,F,U]=await Promise.all([import(FBU+'firebase-app.js'),import(FBU+'firebase-firestore.js'),import(FBU+'firebase-auth.js')]);
  const ap=A.initializeApp(C.firebase),db=F.getFirestore(ap),au=U.getAuth(ap);
  await new Promise(res=>U.onAuthStateChanged(au,u=>{
    if(u)res();
    else{
      document.getElementById('app').innerHTML='<div class="card" style="max-width:420px;margin:30px auto"><b>Masuk</b><label>Email</label><input id="lgE" type="email"><label>Password</label><input id="lgP" type="password"><button class="btn" id="lgB">Masuk</button><p id="lgM" class="mu"></p></div>';
      document.getElementById('lgB').onclick=async()=>{try{await U.signInWithEmailAndPassword(au,document.getElementById('lgE').value.trim(),document.getElementById('lgP').value)}catch(x){document.getElementById('lgM').textContent='Email atau password salah.'}};
    }
  }));
  const rs=await F.getDoc(F.doc(db,'users',au.currentUser.uid));
  return{
    role:rs.exists()?rs.data().role:null,
    loadAll:async()=>{const g=async c=>(await F.getDocs(F.collection(db,c))).docs.map(d=>({id:d.id,...d.data()}));const[alat,bulan]=await Promise.all([g('alat'),g('alat_bulan')]);return{alat,bulan}},
    save:async(sets,dels)=>{const all=[...sets.map(s=>['s',...s]),...dels.map(d=>['d',...d])];for(let k=0;k<all.length;k+=400){const b=F.writeBatch(db);all.slice(k,k+400).forEach(x=>x[0]==='s'?b.set(F.doc(db,x[1],x[2]),x[3]):b.delete(F.doc(db,x[1],x[2])));await b.commit()}}
  };
}

(async()=>{
  try{
    document.getElementById('app').innerHTML='<p class="mu" style="padding:20px">Memuat data...</p>';
    DBX=await connectDB();
    canEdit=DBX.role==='admin';
    applyData(await DBX.loadAll());
    render();
  }catch(e){
    document.getElementById('app').innerHTML='<div class="card" style="max-width:520px;margin:30px auto"><b>Gagal memuat</b><p class="mu">'+esc(e.message||e)+'</p></div>';
  }
})();
</script>
