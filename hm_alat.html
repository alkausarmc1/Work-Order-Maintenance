html{scroll-padding-top:env(safe-area-inset-top,0px);min-height:100%}
body{margin:0;min-height:100vh;background-color:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;text-shadow:var(--float-shadow)}
body::before{content:"";position:fixed;inset:0;z-index:-1;background-image:var(--bg-overlay),var(--bg-photo);background-size:cover;background-position:center center;background-repeat:no-repeat;pointer-events:none}
#app{max-width:1040px;margin:0 auto;padding:16px 14px 32px;background:transparent}
h1{font-size:22px;font-weight:800;margin:4px 0 14px;letter-spacing:.01em;color:#ffffff;text-shadow:var(--title-shadow)}
h2{font-size:16px;font-weight:800;margin:20px 0 8px;letter-spacing:.01em;color:#ffffff;text-shadow:var(--title-shadow)}
.topbar{position:fixed;right:12px;top:8px;font:13px system-ui;z-index:5;display:flex;align-items:center;gap:10px;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--bd);padding:5px 13px;border-radius:999px;box-shadow:var(--shadow)}
.topbar a{color:var(--ac-text);text-decoration:none;font-weight:700}.topbar a:hover{text-decoration:underline}
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px}
.tabs button{flex:none;padding:8px 14px;border:1px solid var(--bd);background:var(--sf);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#ffffff;border-radius:9px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;text-shadow:var(--float-shadow);box-shadow:0 2px 8px rgba(0,0,0,.22);transition:all .15s ease}
.tabs button:hover{border-color:var(--ac-text);background:rgba(20,184,166,.22)}
.tabs button.on{background:rgba(13,148,136,.85);color:#ffffff;border-color:#5eead4;font-weight:700;box-shadow:0 3px 12px rgba(13,148,136,.42)}
.card{border:1px solid var(--bd);border-radius:12px;padding:14px;background:var(--sf);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:var(--shadow)}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px;font-weight:600;text-shadow:var(--float-shadow)}
input,select,textarea{width:100%;box-sizing:border-box;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--in-bg);color:#ffffff;font:inherit;text-shadow:none;transition:border-color .15s ease,background .15s ease}
input:focus,select:focus,textarea:focus{outline:none;border-color:#5eead4;background:rgba(8,16,20,.75)}
select option{background:#0f1c20;color:#ffffff}
.btn{margin-top:12px;padding:10px 16px;border:1px solid rgba(94,234,212,.45);border-radius:9px;background:rgba(13,148,136,.85);color:#ffffff;font:inherit;font-weight:700;width:100%;cursor:pointer;text-shadow:var(--float-shadow);box-shadow:0 3px 10px rgba(0,0,0,.28);transition:all .15s ease}
.btn:hover{background:rgba(20,184,166,.92)}
.btn.s{background:var(--sf);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#ffffff;border:1px solid var(--bd);margin-top:8px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.btn.s:hover{border-color:#5eead4;background:rgba(20,184,166,.2)}
.jobs{display:flex;flex-wrap:wrap;gap:8px}.jobs label{display:flex;align-items:center;gap:6px;margin:0;padding:7px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--in-bg);color:#ffffff;font-size:14px;width:auto;cursor:pointer}.jobs input{width:auto}

/* Tabel dibuat transparan penuh agar gambar background terlihat jelas */
.w{overflow-x:auto;background:transparent !important;backdrop-filter:none !important;-webkit-backdrop-filter:none !important;border:1px solid var(--bd);border-radius:10px;box-shadow:0 4px 18px rgba(0,0,0,.18)}
table,thead,tbody,tfoot,tr,th,td{background:transparent !important;background-color:transparent !important}
table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{padding:7px 9px;border-bottom:1px solid rgba(255,255,255,.20);border-right:1px solid rgba(255,255,255,.12);text-align:right;white-space:nowrap;color:#ffffff;text-shadow:var(--float-shadow)}
th:last-child,td:last-child{border-right:0}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--hover-row) !important;transition:background .15s ease}
th{color:var(--ac-text);font-weight:800;text-transform:uppercase;font-size:11.5px;letter-spacing:.04em;border-bottom:1.5px solid var(--bd-strong);white-space:normal}
td{font-weight:600}
td.l,th.l{text-align:left;white-space:normal}
td[style*="ffe699"]{background:rgba(253,224,71,.28) !important;color:#fef08a !important;font-weight:800 !important}
tr.t td{font-weight:800;color:#fde047;border-top:1.5px solid var(--bd-strong);background:rgba(255,255,255,.07) !important}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.mu{color:var(--mu);font-size:12.5px;text-shadow:var(--float-shadow)}
.x{border:0;background:none;color:#ff6b6b;font-size:16px;font-weight:700;cursor:pointer;text-shadow:var(--float-shadow)}
.bs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:6px;margin-top:8px}
.bs-cell{display:flex;align-items:center;gap:6px;background:var(--in-bg);border:1px solid var(--bd);border-radius:8px;padding:4px 7px}

.bs-cell input{padding:5px 6px;border:1px solid var(--bd);border-radius:6px;background:rgba(6,12,15,.65);color:#ffffff;text-align:right;font-size:13px}
.bs-cell.has{border-color:#5eead4;background:rgba(20,184,166,.22)}
details.card>summary{cursor:pointer;font-weight:700;font-size:14px;user-select:none;color:var(--ac-text);text-shadow:var(--float-shadow)}
#msg{background:var(--sf-solid) !important;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}

<div class="topbar"><a href="menu.html">Menu</a><span id="sync"></span></div><div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>

<script>
let S={machines:[],logs:[],solar:{},service:[]},DBX=null,canEdit=false,tab='rk',mon=new Date().toISOString().slice(0,7),rf='',rt='',ed=-1,hf='';
const LW={'Evakuasi Jangkos':40,'Langsir Cangkang':25,'Evakuasi Solid':20,'Langsir Kernel':5,'Langsir Kalsium':4,'Evakuasi Buah':3,'Other':3},DEF={'Loader xc938':LW,'Loader Lw300kn':{'Evakuasi Buah':70,'Evakuasi Jangkos':5,'Evakuasi Solid':5,'Langsir Cangkang':5,'Langsir Kernel':5,'Langsir Kalsium':5,'Other':5},'Excavator xe135b':{'Evakuasi Jangkos':40,'Evakuasi Cangkang':25,'Evakuasi Solid':20,'Other':15}};
S.machines.forEach(m=>{if(!m.w)m.w=DEF[m.n]||{}});S.service=S.service||[];
try{const u=JSON.parse(sessionStorage.getItem('hm_ui')||'{}');tab=u.tab||tab;mon=u.mon||mon;hf=u.hf||hf;rf=u.rf||rf;rt=u.rt||rt}catch(e){}
const $=s=>document.querySelector(s),HARI=['Minggu','Senin','Selasa','Rabu','Kamis',"Jum'at",'Sabtu'],BLN=['JAN','FEB','MAR','APRIL','MEI','JUNI','JULI','AGUST','SEPT','OKT','NOV','DES'];
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n=(v,d=1)=>(+v).toLocaleString('en-US',{useGrouping:false,minimumFractionDigits:d,maximumFractionDigits:2}),mach=m=>S.machines.find(x=>x.n===m);
const sorted=m=>S.logs.map((l,i)=>({...l,i})).filter(l=>l.m===m).sort((a,b)=>a.d.localeCompare(b.d)||a.i-b.i);
function shares(m,ks,tot){const mc=mach(m),ws=mc.w||{},fx=mc.fx||{},avg=mc.jobs.length?100/mc.jobs.length:1,T=tot>0?tot:0;if(!T)return ks.map(()=>1/ks.length);
 const isF=ks.map(k=>fx[k]!==undefined),fs=ks.map((k,i)=>isF[i]?Math.min(+fx[k],T):0),fsum=fs.reduce((a,b)=>a+b,0);
 const w=ks.map((k,i)=>isF[i]?0:(ws[k]!==undefined?+ws[k]:(ws['Other']!==undefined?+ws['Other']:avg))),wt=w.reduce((a,b)=>a+b,0);
 return ks.map((k,i)=>isF[i]?fs[i]/T:(wt>0?(T-fsum)/T*w[i]/wt:0))}
function startHM(m){const L=sorted(m);return L.length?+L[L.length-1].hm:+mach(m).hm}
function build(m,mo){const mc=mach(m),L=sorted(m);let hm=+mc.hm,hs=+mc.hm,J=+mc.solar0;const p=mo+'-01';
 L.filter(l=>l.d<p).forEach(l=>{hs+=l.hm-hm;hm=+l.hm});
 Object.keys(S.solar).forEach(k=>{const[a,d]=k.split('|');if(a===m&&d<p)J+=(+S.solar[k]||0)});
 const inM=L.filter(l=>l.d.startsWith(mo));
 const solDays=Object.keys(S.solar).filter(k=>{const[a,d]=k.split('|');return a===m&&d.startsWith(mo)&&(+S.solar[k]||0)>0}).map(k=>+k.split('|')[1].slice(8));
 if(!inM.length&&!solDays.length)return[];
 const lastLog=inM.length?+inM[inM.length-1].d.slice(8):0;
 const lastSol=solDays.length?Math.max(...solDays):0;
 const last=Math.max(lastLog,lastSol),[y,mm]=mo.split('-').map(Number),out=[];
 for(let day=1;day<=last;day++){const d=mo+'-'+String(day).padStart(2,'0'),ls=inM.filter(l=>l.d===d),sol=(+S.solar[m+'|'+d]||0);J+=sol;
  const rs=ls.length?ls:[{hm,ket:''}];
  rs.forEach((l,k)=>{const s=hm;hm=+l.hm;const g=hm-s;hs+=g;out.push({day,y,mm,hari:HARI[new Date(y,mm-1,day).getDay()],s,f:hm,g,hs,sol:k?null:sol,J:k?null:J,ket:l.ket||'',op:l.op||'',sf:l.sf||0,jo:l.jo||0,ja:l.ja||'',jb:l.jb||'',first:!k,cnt:rs.length,i:l.i})})}
 return out}
const MID={},SNAP={};
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const clean=o=>JSON.parse(JSON.stringify(o));
function payloads(){const P={},mach={};
 S.machines.forEach((m,i)=>{const nm=m.n.trim();if(!MID[nm])MID[nm]=slug(nm);mach[MID[nm]]={...clean(m),n:nm,id:MID[nm],urut:i}});
 const get=(n,mo)=>{const nm=String(n).trim(),id=MID[nm]||(MID[nm]=slug(nm)),k=id+'_'+mo;return P[k]||(P[k]={id:k,mesin_id:id,bulan:mo,logs:[],solar:{},service:[]})};
 S.logs.forEach(l=>{const{m,...r}=l;get(m,l.d.slice(0,7)).logs.push(clean(r))});
 Object.keys(S.solar).forEach(k=>{const[n,d]=k.split('|'),nm=String(n).trim();if(MID[nm]!==undefined||S.machines.some(x=>x.n.trim()===nm))get(nm,d.slice(0,7)).solar[d]=(+S.solar[k]||0)});
 (S.service||[]).forEach(s=>get(s.m,s.d.slice(0,7)).service.push(clean(s)));
 return{P,mach}}
function status(t,er){const e=document.getElementById('sync');if(e){e.textContent=t;e.style.color=er?'#dc2626':'var(--ac)'}}
let busy=Promise.resolve();
function commit(){busy=busy.then(commitNow);return busy}
async function commitNow(){
 if(!canEdit){alert('Kamu tidak punya izin mengubah data.');return}
 try{status('Menyimpan...');const{P,mach}=payloads(),sets=[],dels=[];
  Object.entries(mach).forEach(([id,d])=>{const j=JSON.stringify(d);if(SNAP['alat/'+id]!==j)sets.push(['alat',id,d,j])});
  Object.entries(P).forEach(([id,d])=>{const empty=!d.logs.length&&!Object.keys(d.solar).length&&!d.service.length,j=JSON.stringify(d);
   if(empty){if(SNAP['alat_bulan/'+id]!==undefined)dels.push(['alat_bulan',id])}else if(SNAP['alat_bulan/'+id]!==j)sets.push(['alat_bulan',id,d,j])});
  Object.keys(SNAP).filter(k=>k.startsWith('alat_bulan/')&&!P[k.slice(11)]).forEach(k=>dels.push(['alat_bulan',k.slice(11)]));
  if(sets.length||dels.length)await DBX.save(sets.map(s=>s.slice(0,3)),dels);
  sets.forEach(s=>SNAP[s[0]+'/'+s[1]]=s[3]);dels.forEach(d=>delete SNAP[d[0]+'/'+d[1]]);
  status('Tersimpan '+new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}))}
 catch(e){status('Gagal menyimpan',1);alert('Gagal menyimpan: '+(e.message||e))}}
function applyData(D){S={machines:[],logs:[],solar:{},service:[]};
 D.alat.sort((a,b)=>(a.urut||0)-(b.urut||0)).forEach(a=>{const{id,urut,...m}=a;m.n=String(m.n||'').trim();MID[m.n]=id;S.machines.push(m);SNAP['alat/'+id]=JSON.stringify({...clean(m),id,urut})});
 const nm={};Object.entries(MID).forEach(([n,id])=>nm[id]=n);
 const order=Object.fromEntries(D.alat.map((a,i)=>[a.id,i]));
 D.bulan.sort((a,b)=>a.bulan<b.bulan?-1:a.bulan>b.bulan?1:(order[a.mesin_id]||0)-(order[b.mesin_id]||0)).forEach(b=>{const n=nm[b.mesin_id];if(!n)return;
  SNAP['alat_bulan/'+b.id]=JSON.stringify({id:b.id,mesin_id:b.mesin_id,bulan:b.bulan,logs:b.logs||[],solar:b.solar||{},service:b.service||[]});
  (b.logs||[]).forEach(l=>S.logs.push({...l,m:n}));Object.entries(b.solar||{}).forEach(([d,v])=>S.solar[n+'|'+d]=(+v||0));(b.service||[]).forEach(s=>S.service.push({...s,m:nm[MID[String(s.m||'').trim()]]||String(s.m||'').trim()}))})}
function rekap(){const rows=S.logs.filter(l=>(!rf||l.d>=rf)&&(!rt||l.d<=rt));
 return `<h2>Ringkasan semua mesin</h2><div class="row2"><div><label>Dari tanggal</label><input type="date" value="${rf}" onchange="rf=this.value;render()"></div><div><label>Sampai tanggal</label><input type="date" value="${rt}" onchange="rt=this.value;render()"></div></div>
 <div class="w" style="margin-top:10px"><table><tr><th class="l">Mesin</th><th>Hari</th><th>HM Pemakaian</th><th>Isi Solar (L)</th><th>HM Terakhir</th><th>HM Service</th></tr>
 ${S.machines.map(m=>{const ls=sorted(m.n),use=ls.filter(l=>rows.includes(S.logs[l.i]));let prev=+m.hm,tot=0;
  ls.forEach(l=>{if(rows.includes(S.logs[l.i]))tot+=l.hm-prev;prev=+l.hm});
  const sol=Object.keys(S.solar).filter(k=>k.split('|')[0]===m.n&&(!rf||k.split('|')[1]>=rf)&&(!rt||k.split('|')[1]<=rt)).reduce((a,k)=>a+(+S.solar[k]||0),0);
  return `<tr><td class="l">${esc(m.n)}</td><td>${new Set(use.map(l=>l.d)).size}</td><td>${n(tot)}</td><td>${n(sol,0)}</td><td>${n(startHM(m.n))}</td><td>${svcBase(m.n)?n(startHM(m.n)-svcBase(m.n)):'-'}</td></tr>`}).join('')}</table></div>
 <p class="mu">Detail harian dan rekap per kegiatan ada di tab tiap mesin. HM Service dihitung dari service terakhir yang dicatat (atau HM baru ganti di tab Master kalau belum ada).</p>${svcAll()}`}
function mesin(mi){const m=S.machines[mi],R=build(m.n,mon);let sol=0;
 R.forEach(r=>{if(r.first)sol+=r.sol});
 const by={},bj={};R.forEach(r=>{const k=(r.ket||'-').trim();by[k]=(by[k]||0)+r.g;bj[k]=(bj[k]||0)+r.jo});const bo={},boj={};R.forEach(r=>{const k=(r.op||'-').trim();bo[k]=(bo[k]||0)+r.g;boj[k]=(boj[k]||0)+r.jo});
 return `<h2>Monitoring HM ${esc(m.n)}</h2><div class="row2"><div><label>Bulan</label><input type="month" value="${mon}" onchange="if(this.value){mon=this.value;render()}"></div><div style="align-self:end"><button type="button" class="btn s" style="margin:0" onclick="exp(${mi})">Unduh Excel</button></div></div>
 <div class="w" style="margin-top:10px"><table><tr><th>No</th><th>Hari</th><th>Tgl</th><th>HM Awal</th><th>HM Akhir</th><th>HM Pemakaian</th><th>HM SHI</th><th>Isi Solar (L)</th><th>SHI (L)</th><th>L/HM</th><th class="l">Keterangan</th><th class="l">Operator</th><th>Jam Operator</th></tr>
 ${R.map(r=>`<tr><td>${r.first?r.day:''}</td><td>${r.first?r.hari:''}</td><td>${r.first?r.day+'/'+r.mm:''}</td><td>${n(r.s)}</td><td${r.sf?' style="background:#ffe699;color:#000;font-weight:700"':''}>${n(r.f)}${r.sf?' ⇄':''}</td><td>${n(r.g)}</td><td>${n(r.hs)}</td><td>${r.first?n(r.sol,0):''}</td><td>${r.first?n(r.J):''}</td><td>${r.first&&r.hs?n(r.J/r.hs,2):''}</td><td class="l">${esc(r.ket)}</td><td class="l">${esc(r.op)}</td><td>${r.ja?r.ja+'–'+r.jb+' ('+n(r.jo)+')':(r.jo?n(r.jo):'')}</td></tr>`).join('')||'<tr><td colspan="13" class="l">Belum ada data bulan ini.</td></tr>'}

   if(d>=1&&d<=maxD&&!isNaN(v)){byDay[d]=Math.round(((byDay[d]||0)+v)*10)/10;datedMode=true}
   return;
  }
  let mDay=cleanL.match(/^(?:tgl\.?\s*)?(\d{1,2})[\s.:;=\-\t]+([0-9.,]+)$/i);
  if(mDay){
   const d=+mDay[1],v=parseSol(mDay[2]);

  }
 });
 if(datedMode){

   const inp=document.querySelector(`.bs-in[data-day="${d}"]`);

 }

 let filled=0;
 rawLines.forEach((raw,idx)=>{

  const s=raw.trim().replace(/\b(liter|ltr|l)\b/gi,'').trim();

 });
