<style>

</style></head><body>
<div id="sync" style="position:fixed;right:10px;top:6px;font:12px system-ui;z-index:5"></div><div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>

<script>
let S={machines:[],logs:[],solar:{},service:[]},DBX=null,canEdit=false,tab='rk',mon=new Date().toISOString().slice(0,7),rf='',rt='',ed=-1,hf='';
const LW={'Evakuasi Jangkos':40,'Langsir Cangkang':25,'Evakuasi Solid':20,'Langsir Kernel':5,'Langsir Kalsium':4,'Evakuasi Buah':3,'Other':3},DEF={'Loader xc938':LW,'Loader Lw300kn':{'Evakuasi Buah':70,'Evakuasi Jangkos':5,'Evakuasi Solid':5,'Langsir Cangkang':5,'Langsir Kernel':5,'Langsir Kalsium':5,'Other':5},'Excavator xe135b':{'Evakuasi Jangkos':40,'Evakuasi Cangkang':25,'Evakuasi Solid':20,'Other':15}};
S.machines.forEach(m=>{if(!m.w)m.w=DEF[m.n]||{}});S.service=S.service||[];
try{const u=JSON.parse(sessionStorage.getItem('hm_ui')||'{}');tab=u.tab||tab;mon=u.mon||mon;hf=u.hf||hf;rf=u.rf||rf;rt=u.rt||rt}catch(e){}
const $=s=>document.querySelector(s),HARI=['Minggu','Senin','Selasa','Rabu','Kamis',"Jum'at",'Sabtu'],BLN=['JAN','FEB','MAR','APRIL','MEI','JUNI','JULI','AGUST','SEPT','OKT','NOV','DES'];
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n=(v,d=1)=>(+v).toLocaleString('en-US',{useGrouping:false,minimumFractionDigits:d,maximumFractionDigits:2}),mach=m=>S.machines.find(x=>x.n===m);
const sorted=m=>S.logs.map((l,i)=>({...l,i})).filter(l=>l.m===m).sort((a,b)=>a.d.localeCompare(b.d)||a.i-b.i);
function shares(m,ks,tot){const mc=mach(m),ws=mc.w||{},fx=mc.fx||{},avg=mc.jobs.length?100/mc.jobs.length:1,T=tot>0?tot:0;if(!T)return ks.map(()=>1/ks.length);
 const isF=ks.map(k=>fx[k]!==undefined),fs=ks.map((k,i)=>isF[i]?Math.min(+fx[k],T):0),fsum=fs.reduce((a,b)=>a+b,0);
 const w=ks.map((k,i)=>isF[i]?0:(ws[k]!==undefined?+ws[k]:(ws['Other']!==undefined?+ws['Other']:avg))),wt=w.reduce((a,b)=>a+b,0);
 return ks.map((k,i)=>isF[i]?fs[i]/T:(wt>0?(T-fsum)/T*w[i]/wt:0))}
function startHM(m){const L=sorted(m);return L.length?+L[L.length-1].hm:+mach(m).hm}
function build(m,mo){const mc=mach(m),L=sorted(m);let hm=+mc.hm,hs=+mc.hm,J=+mc.solar0;const p=mo+'-01';
 L.filter(l=>l.d<p).forEach(l=>{hs+=l.hm-hm;hm=+l.hm});
 Object.keys(S.solar).forEach(k=>{const[a,d]=k.split('|');if(a===m&&d<p)J+=S.solar[k]});
 const inM=L.filter(l=>l.d.startsWith(mo));if(!inM.length)return[];
 const last=+inM[inM.length-1].d.slice(8),[y,mm]=mo.split('-').map(Number),out=[];
 for(let day=1;day<=last;day++){const d=mo+'-'+String(day).padStart(2,'0'),ls=inM.filter(l=>l.d===d),sol=S.solar[m+'|'+d]||0;J+=sol;
  const rs=ls.length?ls:[{hm,ket:''}];
  rs.forEach((l,k)=>{const s=hm;hm=+l.hm;const g=hm-s;hs+=g;out.push({day,y,mm,hari:HARI[new Date(y,mm-1,day).getDay()],s,f:hm,g,hs,sol:k?null:sol,J:k?null:J,ket:l.ket||'',op:l.op||'',sf:l.sf||0,jo:l.jo||0,ja:l.ja||'',jb:l.jb||'',first:!k,cnt:rs.length,i:l.i})})}

const MID={},SNAP={};
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const clean=o=>JSON.parse(JSON.stringify(o));
function payloads(){const P={},mach={};
 S.machines.forEach((m,i)=>{if(!MID[m.n])MID[m.n]=slug(m.n);mach[MID[m.n]]={...clean(m),id:MID[m.n],urut:i}});
 const get=(n,mo)=>{const id=MID[n]||(MID[n]=slug(n)),k=id+'_'+mo;return P[k]||(P[k]={id:k,mesin_id:id,bulan:mo,logs:[],solar:{},service:[]})};
 S.logs.forEach(l=>{const{m,...r}=l;get(m,l.d.slice(0,7)).logs.push(clean(r))});
 Object.keys(S.solar).forEach(k=>{const[n,d]=k.split('|');if(MID[n]!==undefined||S.machines.some(x=>x.n===n))get(n,d.slice(0,7)).solar[d]=S.solar[k]});
 (S.service||[]).forEach(s=>get(s.m,s.d.slice(0,7)).service.push(clean(s)));
 return{P,mach}}
function status(t,er){const e=document.getElementById('sync');if(e){e.textContent=t;e.style.color=er?'#b3261e':'#2a7048'}}
let busy=Promise.resolve();
function commit(){busy=busy.then(commitNow);return busy}
async function commitNow(){
 if(!canEdit){alert('Kamu tidak punya izin mengubah data.');return}
 try{status('Menyimpan...');const{P,mach}=payloads(),sets=[],dels=[];
  Object.entries(mach).forEach(([id,d])=>{const j=JSON.stringify(d);if(SNAP['alat/'+id]!==j)sets.push(['alat',id,d,j])});
  Object.entries(P).forEach(([id,d])=>{const empty=!d.logs.length&&!Object.keys(d.solar).length&&!d.service.length,j=JSON.stringify(d);
   if(empty){if(SNAP['alat_bulan/'+id]!==undefined)dels.push(['alat_bulan',id])}else if(SNAP['alat_bulan/'+id]!==j)sets.push(['alat_bulan',id,d,j])});
  Object.keys(SNAP).filter(k=>k.startsWith('alat_bulan/')&&!P[k.slice(11)]).forEach(k=>dels.push(['alat_bulan',k.slice(11)]));
  if(sets.length||dels.length)await DBX.save(sets.map(s=>s.slice(0,3)),dels);
  sets.forEach(s=>SNAP[s[0]+'/'+s[1]]=s[3]);dels.forEach(d=>delete SNAP[d[0]+'/'+d[1]]);
  status('Tersimpan '+new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}))}
 catch(e){status('Gagal menyimpan',1);alert('Gagal menyimpan: '+(e.message||e))}}
function applyData(D){S={machines:[],logs:[],solar:{},service:[]};
 D.alat.sort((a,b)=>(a.urut||0)-(b.urut||0)).forEach(a=>{const{id,urut,...m}=a;MID[m.n]=id;S.machines.push(m);SNAP['alat/'+id]=JSON.stringify({...clean(m),id,urut})});
 const nm={};Object.entries(MID).forEach(([n,id])=>nm[id]=n);
 const order=Object.fromEntries(D.alat.map((a,i)=>[a.id,i]));
 D.bulan.sort((a,b)=>a.bulan<b.bulan?-1:a.bulan>b.bulan?1:(order[a.mesin_id]||0)-(order[b.mesin_id]||0)).forEach(b=>{const n=nm[b.mesin_id];if(!n)return;
  SNAP['alat_bulan/'+b.id]=JSON.stringify({id:b.id,mesin_id:b.mesin_id,bulan:b.bulan,logs:b.logs||[],solar:b.solar||{},service:b.service||[]});
  (b.logs||[]).forEach(l=>S.logs.push({...l,m:n}));Object.entries(b.solar||{}).forEach(([d,v])=>S.solar[n+'|'+d]=v);(b.service||[]).forEach(s=>S.service.push(s))})}
function rekap(){const rows=S.logs.filter(l=>(!rf||l.d>=rf)&&(!rt||l.d<=rt));
 return `<h2>Ringkasan semua mesin</h2><div class="row2"><div><label>Dari tanggal</label><input type="date" value="${rf}" onchange="rf=this.value;render()"></div><div><label>Sampai tanggal</label><input type="date" value="${rt}" onchange="rt=this.value;render()"></div></div>
 <div class="w" style="margin-top:10px"><table><tr><th class="l">Mesin</th><th>Hari</th><th>HM Pemakaian</th><th>Isi Solar (L)</th><th>HM Terakhir</th><th>HM Service</th></tr>
 ${S.machines.map(m=>{const ls=sorted(m.n),use=ls.filter(l=>rows.includes(S.logs[l.i]));let prev=+m.hm,tot=0;
  ls.forEach(l=>{if(rows.includes(S.logs[l.i]))tot+=l.hm-prev;prev=+l.hm});
  const sol=Object.keys(S.solar).filter(k=>k.split('|')[0]===m.n&&(!rf||k.split('|')[1]>=rf)&&(!rt||k.split('|')[1]<=rt)).reduce((a,k)=>a+S.solar[k],0);
  return `<tr><td class="l">${esc(m.n)}</td><td>${new Set(use.map(l=>l.d)).size}</td><td>${n(tot)}</td><td>${n(sol,0)}</td><td>${n(startHM(m.n))}</td><td>${svcBase(m.n)?n(startHM(m.n)-svcBase(m.n)):'-'}</td></tr>`}).join('')}</table></div>
 <p class="mu">Detail harian dan rekap per kegiatan ada di tab tiap mesin. HM Service dihitung dari service terakhir yang dicatat (atau HM baru ganti di tab Master kalau belum ada).</p>${svcAll()}`}
function mesin(mi){const m=S.machines[mi],R=build(m.n,mon);let sol=0;
 R.forEach(r=>{if(r.first)sol+=r.sol});
 const by={},bj={};R.forEach(r=>{const k=(r.ket||'-').trim();by[k]=(by[k]||0)+r.g;bj[k]=(bj[k]||0)+r.jo});const bo={},boj={};R.forEach(r=>{const k=(r.op||'-').trim();bo[k]=(bo[k]||0)+r.g;boj[k]=(boj[k]||0)+r.jo});
 return `<h2>Monitoring HM ${esc(m.n)}</h2><div class="row2"><div><label>Bulan</label><input type="month" value="${mon}" onchange="if(this.value){mon=this.value;render()}"></div><div style="align-self:end"><button class="btn s" style="margin:0" onclick="exp(${mi})">Unduh Excel</button></div></div>
 <div class="w" style="margin-top:10px"><table><tr><th>No</th><th>Hari</th><th>Tgl</th><th>HM Awal</th><th>HM Akhir</th><th>HM Pemakaian</th><th>HM SHI</th><th>Isi Solar (L)</th><th>SHI (L)</th><th>L/HM</th><th class="l">Keterangan</th><th class="l">Operator</th><th>Jam Operator</th></tr>
 ${R.map(r=>`<tr><td>${r.first?r.day:''}</td><td>${r.first?r.hari:''}</td><td>${r.first?r.day+'/'+r.mm:''}</td><td>${n(r.s)}</td><td${r.sf?' style="background:#ffe699;color:#000;font-weight:700"':''}>${n(r.f)}${r.sf?' ⇄':''}</td><td>${n(r.g)}</td><td>${n(r.hs)}</td><td>${r.first?n(r.sol,0):''}</td><td>${r.first?n(r.J):''}</td><td>${r.first&&r.hs?n(r.J/r.hs,2):''}</td><td class="l">${esc(r.ket)}</td><td class="l">${esc(r.op)}</td><td>${r.ja?r.ja+'–'+r.jb+' ('+n(r.jo)+')':(r.jo?n(r.jo):'')}</td></tr>`).join('')||'<tr><td colspan="13" class="l">Belum ada data bulan ini.</td></tr>'}
 <tr class="t"><td colspan="5" class="l">TOTAL</td><td>${n(R.reduce((a,r)=>a+r.g,0))}</td><td></td><td>${n(sol,0)}</td><td colspan="4"></td><td>${n(R.reduce((a,r)=>a+r.jo,0))}</td></tr></table></div>
 <p class="mu">⇄ (sel kuning) = HM akhir shift / pergantian operator</p>${svcOne(m.n)}
 <h2>Jam per kegiatan (Keterangan)</h2><div class="w"><table><tr><th class="l">Kegiatan</th><th>Jam HM</th><th>Jam Operator</th></tr>${Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td class="l">${esc(k)}</td><td>${n(v)}</td><td>${n(bj[k]||0)}</td></tr>`).join('')||'<tr><td class="l" colspan="2">-</td></tr>'}</table></div><h2>Jam per operator</h2><div class="w"><table><tr><th class="l">Operator</th><th>Jam HM</th><th>Jam Kerja Operator</th></tr>${Object.entries(bo).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td class="l">${esc(k)}</td><td>${n(v)}</td><td>${n(boj[k]||0)}</td></tr>`).join('')}</table></div>`}
let eg=null,GC=[];
const gkey=l=>l.sid||(l.m+'|'+l.d+'|'+(l.op||''));
function groups(){const g=new Map();S.logs.forEach((l,i)=>{const k=gkey(l);if(!g.has(k))g.set(k,{k,m:l.m,d:l.d,op:l.op||'',idx:[]});g.get(k).idx.push(i)});return[...g.values()].sort((a,b)=>b.d.localeCompare(a.d)||b.idx[0]-a.idx[0])}
function stAt(m,d,ex){const mi=ex&&ex.length?Math.min(...ex):1e9;const L=sorted(m).filter(l=>!(ex&&ex.includes(l.i))&&(l.d<d||(l.d===d&&l.i<mi)));return L.length?+L[L.length-1].hm:+mach(m).hm}
function nxHM(m,d,ex){const mi=ex&&ex.length?Math.min(...ex):-1;const L=sorted(m).filter(l=>!(ex&&ex.includes(l.i))&&(l.d>d||(mi>=0&&l.d===d&&l.i>mi)));return L.length?+L[0].hm:Infinity}
function chainMap(){const C={};S.machines.forEach(mc=>{let p=+mc.hm;sorted(mc.n).forEach(l=>{C[l.i]={...l,s:p,h:l.hm-p};p=+l.hm})});return C}
function inputTab(){const C=chainMap();GC=groups().filter(g=>!hf||g.d.startsWith(hf));if(!hf)GC=GC.slice(0,60);
 const sk=Object.keys(S.solar).map(k=>({k,m:k.split('|')[0],d:k.split('|')[1],v:S.solar[k]})).filter(x=>!hf||x.d.startsWith(hf)).sort((a,b)=>b.d.localeCompare(a.d)).slice(0,hf?400:60);
 const form=canEdit?`<div class="card">${ed>=0?'<p class="mu"><b>Mengedit shift ('+eg.length+' baris).</b> HM tiap job dipertahankan kalau job dan HM Akhir tidak diubah; kalau diubah, HM dibagi ulang sesuai porsi.</p>':''}<div class="row2"><div><label>Tanggal (boleh tanggal yang sudah lewat)</label><input type="date" id="fd" value="${new Date().toISOString().slice(0,10)}" onchange="jt();prev()"></div>
 <div><label>Mesin</label><select id="fm" onchange="dlist();jt();prev()">${S.machines.map(m=>`<option>${esc(m.n)}</option>`).join('')}</select></div></div>
 <label>Nama operator (jika diisi, HM Akhir ditandai akhir shift)</label><input id="fo" list="dop" autocomplete="off" placeholder="nama operator"><datalist id="dop">${[...new Set(S.logs.map(l=>l.op).filter(Boolean))].map(o=>`<option value="${esc(o)}">`).join('')}</datalist><label>HM Akhir</label><input type="number" step="0.1" inputmode="decimal" id="fh" oninput="onHM()"><p class="mu" id="pv"></p>
 <label>Job yang dikerjakan</label><div class="jobs" id="jb"></div><label>Kegiatan lain (opsional, pisahkan dengan koma)</label><input id="fk" list="dj" autocomplete="off" oninput="jt();prev()" placeholder="ketik kegiatan"><datalist id="dj"></datalist><div id="jt"></div>
 <label>Isi Solar (L) – opsional, sekali per hari</label><input type="number" step="0.1" inputmode="decimal" id="fs">
 <button class="btn" onclick="add()">${ed>=0?'Simpan perubahan':'Simpan data'}</button>${ed>=0?'<button class="btn s" onclick="ed=-1;eg=null;HMJ={};JT={};HDIRTY=false;render()">Batal edit</button>':'<button class="btn s" onclick="off()">Hari libur (Off)</button>'}</div>`:`<p class="mu">Mode lihat saja: hanya pemilik/editor yang bisa menginput data.</p>`;
 const rows=GC.map((g,gi)=>{const rs=g.idx.map(i=>C[i]),f=rs[0],e=rs[rs.length-1],hmT=rs.reduce((a,r)=>a+r.h,0),jo=rs.reduce((a,r)=>a+(r.jo||0),0),ja=(rs.find(r=>r.ja)||{}).ja,jb=[...rs].reverse().map(r=>r.jb).find(Boolean),sf=rs.some(r=>r.sf);
  return `<tr><td>${g.d}</td><td class="l">${esc(g.m)}</td><td class="l">${esc(g.op)}</td><td>${n(f.s)} → ${n(e.hm)}${sf?' ⇄':''}</td><td>${n(hmT)}</td><td class="l">${esc(rs.map(r=>r.ket||'-').join(', '))}</td><td>${ja?ja+'–'+jb+' ('+n(jo)+')':(jo?n(jo):'')}</td>${canEdit?`<td><button class="x" onclick="editG(${gi})">✎</button><button class="x" onclick="delG(${gi})">✕</button></td>`:''}</tr>`}).join('')||'<tr><td colspan="8" class="l">Belum ada data.</td></tr>';
 return form+svcForm()+`<h2>Riwayat input per shift</h2><label>Bulan (kosongkan = 60 terbaru)</label><input type="month" value="${hf}" onchange="hf=this.value;render()"><div class="w"><table><tr><th>Tanggal</th><th class="l">Mesin</th><th class="l">Operator</th><th>HM Awal → Akhir</th><th>HM Pemakaian</th><th class="l">Kegiatan</th><th>Jam Operator</th>${canEdit?'<th></th>':''}</tr>${rows}</table></div><h2>Isi solar tercatat</h2><div class="w"><table><tr><th>Tanggal</th><th class="l">Mesin</th><th>Liter</th>${canEdit?'<th></th>':''}</tr>${sk.map(x=>`<tr><td>${x.d}</td><td class="l">${esc(x.m)}</td><td>${n(x.v)}</td>${canEdit?`<td><button class="x" data-k="${esc(x.k)}" onclick="delS(this.dataset.k)">✕</button></td>`:''}</tr>`).join('')||'<tr><td colspan="4" class="l">-</td></tr>'}</table></div>`}
function dlist(){const js=mach($('#fm').value).jobs;$('#dj').innerHTML=js.map(j=>`<option value="${esc(j)}">`).join('');const b=$('#jb');if(b)b.innerHTML=js.map(j=>`<label><input type="checkbox" class="fj" value="${esc(j)}" onchange="jt();prev()">${esc(j)}</label>`).join('')}

let JT={},HMJ={},HDIRTY=false;
const tmin=x=>{const p=(x||'').split(':');return p.length<2||!p[0]?null:+p[0]*60+ +p[1]};
function dur(a,b){const x=tmin(a),y=tmin(b);return x===null||y===null?0:Math.round(((y-x+1440)%1440)/60*100)/100}
let SH={a:'',b:''};
