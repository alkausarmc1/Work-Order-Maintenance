<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="config.js"></script>
<title>Sambungkan perangkat</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;700&display=swap">
<style>
:root{--bg:#eef1f4;--ink:#14202b;--mut:#51606d;--line:#c9d2da;--ac:#2f5d8a;--g:#2a7048}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.45 Barlow,system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:22px 14px 44px}h1{font-size:28px;margin:4px 0}
.sub{color:var(--mut);font-size:15px}.card{background:#fff;border:1px solid var(--line);border-radius:4px;padding:12px 13px;margin-top:12px}
.btn{display:block;width:100%;border:0;cursor:pointer;background:var(--ac);color:#fff;font-weight:700;font-size:18px;font-family:inherit;padding:13px;border-radius:4px;margin-top:10px;text-align:center;text-decoration:none}
:focus-visible{outline:3px solid #f0a500;outline-offset:2px}textarea{width:100%;font:14px/1.4 ui-monospace,Consolas,monospace;padding:10px;border:1px solid var(--line);border-radius:4px;background:#fff;margin-top:8px}
.note{background:#fff4d6;border:1px solid #e3c56a;border-radius:4px;padding:8px 10px;font-size:15px;margin-top:12px}.ok{background:#e3f1e8;border-color:#8fc3a2}
</style></head><body><main>
<h1>Sambungkan perangkat</h1>
<p class="sub">Menghubungkan komputer atau HP ini ke Firebase yang sama dengan perangkat lain. Cukup sekali per browser.</p>
<div id="app"></div>
</main>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let C={};try{C=JSON.parse(localStorage.getItem('jmcfg')||'{}')}catch(e){}
let F=null;
try{const h=(location.hash.match(/[#&]c=([^&]+)/)||[])[1];if(h){const c=JSON.parse(decodeURIComponent(escape(atob(h.replace(/-/g,'+').replace(/_/g,'/')))));if(c.apiKey&&c.projectId)F=c}}catch(e){}
const parse=t=>{const f={};(String(t).match(/([A-Za-z]+)\s*["']?\s*:\s*["']([^"']+)["']/g)||[]).forEach(x=>{const m=x.match(/([A-Za-z]+)\s*["']?\s*:\s*["']([^"']+)["']/);f[m[1]]=m[2]});return f.apiKey&&f.projectId?f:null};
const done=()=>{$('#app').innerHTML='<div class="note ok"><b>Perangkat ini sudah tersambung</b> ke proyek '+E((JSON.parse(localStorage.getItem('jmcfg')).firebase||{}).projectId)+'. Saat membuka halaman input, kamu akan diminta login dengan akun emailmu.</div><a class="btn" href="menu.html">Buka menu</a>'};
const save=f=>{localStorage.setItem('jmcfg',JSON.stringify({...C,url:C.url||'',key:C.key||'',firebase:f}));C=JSON.parse(localStorage.getItem('jmcfg'));done()};
if(C.firebase&&C.firebase.apiKey&&!F)done();
else if(F)$('#app').innerHTML='<div class="card">Konfigurasi dari tautan terbaca untuk proyek <b>'+E(F.projectId)+'</b>.</div><button class="btn" id="go">Sambungkan perangkat ini</button>',$('#go').onclick=()=>save(F);
else{$('#app').innerHTML='<div class="note">Belum ada konfigurasi di perangkat ini. Buka tautan yang dibagikan dari halaman <b>bagikan.html</b> di perangkat yang sudah tersambung, atau tempel konfigurasi Firebase di bawah.</div><div class="card"><label for="cf">Konfigurasi Firebase</label><textarea id="cf" rows="5" placeholder="const firebaseConfig = { apiKey: &quot;...&quot;, authDomain: &quot;...&quot;, projectId: &quot;...&quot;, ... };"></textarea><button class="btn" id="sv">Simpan</button><p class="sub" id="m"></p></div>';
 $('#sv').onclick=()=>{const f=parse($('#cf').value);if(!f){$('#m').textContent='Konfigurasi tidak terbaca. Salin seluruh teks firebaseConfig.';return}save(f)}}
</script></body></html>
