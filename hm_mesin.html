<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="config.js"></script>
<title>Input HM Mesin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;700&display=swap">
<style>
:root{--bg:#eef1f4;--ink:#14202b;--mut:#51606d;--line:#c9d2da;--card:#fff;--ac:#2f5d8a;--r:#b3261e;--y:#a86400;--g:#2a7048}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.4 'Barlow Semi Condensed',system-ui,sans-serif;padding-bottom:84px}
main{max-width:1400px;margin:0 auto;padding:14px 12px}h1{font-size:28px;line-height:1.1;margin:2px 0 8px;font-weight:700}
h2{font-size:18px;margin:20px 0 6px;font-weight:700;padding-bottom:4px;border-bottom:2px solid var(--ink)}
.sub{color:var(--mut);font-size:15px}.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}a{color:var(--ac)}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:11px 12px}
label{display:block;font-weight:500;font-size:15px;color:var(--mut)}
input{font:inherit;color:var(--ink);padding:10px;border:1px solid var(--line);border-radius:4px;background:#fff;width:100%}
.hd{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.r{display:grid;grid-template-columns:1fr 128px;gap:4px 10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.r b{font-size:18px}.r .id{color:var(--mut);font-size:13px;margin-left:6px;font-weight:400}.l{grid-column:1;color:var(--mut);font-size:14px}
.r input{grid-column:2;grid-row:1/3;text-align:right;font-size:20px;font-variant-numeric:tabular-nums}
.d{grid-column:1/-1;font-size:14px;min-height:0}.d.up{color:var(--g)}.d.wr{color:var(--y)}.d.er{color:var(--r)}
.d label{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:15px;margin-top:3px}.d input{width:22px;height:22px;padding:0}
.pill{font-size:12px;border:1px solid var(--y);color:var(--y);border-radius:3px;padding:0 5px;margin-left:6px}
.rs{grid-column:1/-1;margin-top:2px}.rs input{margin-top:4px;font-size:18px;text-align:left}.l a{font-size:14px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px}
.bar div{max-width:1400px;margin:0 auto;display:flex;gap:10px;align-items:center}.bar span{flex:1;font-size:15px;color:var(--mut)}
.btn{border:0;cursor:pointer;background:var(--ac);color:#fff;font-weight:700;font-size:18px;font-family:inherit;padding:13px 20px;border-radius:4px}.btn[disabled]{opacity:.5}
:focus-visible{outline:3px solid #f0a500;outline-offset:2px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0;max-width:640px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(420px,100%),1fr));gap:0 32px}
#lg{max-width:420px;margin:40px auto}
@media(min-width:900px){.hd{grid-template-columns:1fr 1fr 1fr}}
.tabs button{font:700 16px inherit;font-family:inherit;padding:11px 4px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:4px;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tw{overflow-x:auto;margin-top:8px}table.t{border-collapse:collapse;width:100%;font-size:14px;background:#fff}
.t th,.t td{border:1px solid var(--line);padding:4px 6px;text-align:right;white-space:nowrap}.t th{background:#f3f5f7;text-align:center}
.t td:first-child,.t th:first-child{text-align:left;position:sticky;left:0;background:#fff;z-index:1}.t th:first-child{background:#f3f5f7}
.t tr.ar td{background:#dde3e8;font-weight:700;text-align:left}.t .c{text-align:center;white-space:normal}.t .k{text-align:left;white-space:normal}
.t .rd{background:#f4b6b6;font-weight:700}.t .wr{color:var(--r);font-weight:700}.t .z{color:var(--mut)}
.sh{display:flex;justify-content:space-between;font-weight:700;font-size:15px;margin-top:16px}
@media print{.noprint,.bar{display:none!important}body{background:#fff;padding:0}main{max-width:none;padding:0}.t{font-size:10px}.t td:first-child,.t th:first-child{position:static}.sh{break-after:avoid}.tw{break-inside:avoid;overflow:visible}}
.note{background:#fff4d6;border:1px solid #e3c56a;border-radius:4px;padding:8px 10px;font-size:15px;margin:10px 0}.ok{background:#e3f1e8;border-color:#8fc3a2}.bad{background:#fbe4e1;border-color:#e0958e}
</style></head><body><main id="app"><p class="sub">Memuat...</p></main>
<div class="bar" id="bar" hidden><div><span id="cnt"></span><button class="btn" id="sv">Simpan</button></div></div>
<script type="module">
const FBU='https://www.gstatic.com/firebasejs/10.14.1/',$=s=>document.querySelector(s),app=$('#app');
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const N=x=>x==null||x===''||isNaN(x)?'-':String(Math.round(+x*100)/100);
const D=s=>{if(!s)return'-';const d=new Date(s);return isNaN(d)?E(s):d.toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})};
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const d1=v=>{v=String(v).replace(',','.').replace(/[^0-9.]/g,'');const p=v.split('.');return p[0]+(p.length>1?'.'+p.slice(1).join('').slice(0,1):'')};
const d2=v=>{v=String(v).replace(',','.').replace(/[^0-9.]/g,'');const p=v.split('.');return p[0]+(p.length>1?'.'+p.slice(1).join('').slice(0,2):'')};
const r2=x=>Math.round(x*100)/100;
const ORDER=['LOADING RAMP','STERILIZER','THRESHER','EB PRESS','PRESS','KLARIFIKASI','KERNEL','BOILER','WATER TREATMENT','POWER HOUSE','EFFLUENT TREATMENT','OIL DESPATCH'];
let C={};try{C=JSON.parse(localStorage.getItem('jmcfg')||'{}')}catch(e){}
function login(U,au){return new Promise(res=>{app.innerHTML='<form class="card" id="lg"><b>Masuk sebagai admin</b><label>Email<input id="e" type="email" autocomplete="username"></label><label>Password<input id="p" type="password" autocomplete="current-password"></label><button class="btn" style="margin-top:10px;width:100%">Masuk</button><p id="m" class="sub"></p></form>';
 $('#lg').onsubmit=async ev=>{ev.preventDefault();try{await U.signInWithEmailAndPassword(au,$('#e').value.trim(),$('#p').value)}catch(x){$('#m').textContent='Email atau password salah.'}}})}
async function connect(){
 if(window.__DBMOCK)return window.__DBMOCK;
 if(!C.firebase||!C.firebase.apiKey)throw new Error('Firebase belum tersambung di perangkat ini.');
 const[A,F,U]=await Promise.all([import(FBU+'firebase-app.js'),import(FBU+'firebase-firestore.js'),import(FBU+'firebase-auth.js')]);
 const ap=A.initializeApp(C.firebase),db=F.getFirestore(ap),au=U.getAuth(ap);
 await new Promise(res=>U.onAuthStateChanged(au,u=>u?res():login(U,au)));
 const rs=await F.getDoc(F.doc(db,'users',au.currentUser.uid));
 return{role:rs.exists()?rs.data().role:null,email:au.currentUser.email,
  load:async()=>(await F.getDocs(F.query(F.collection(db,'mesin'),F.where('vital','==',true)))).docs.map(d=>({id:d.id,...d.data()})),
  log:async a=>(await F.getDocs(F.query(F.collection(db,'hm_log'),F.where('tanggal','>=',a)))).docs.map(d=>d.data()),
  sp:async()=>(await F.getDocs(F.collection(db,'sparepart_standar'))).docs.map(d=>({id:d.id,...d.data()})),
  save:async(rows,tgl,oleh,jam)=>{const ops=[];rows.forEach(r=>{ops.push(b=>b.set(F.doc(db,'hm_log',r.id+'_'+tgl),{mesin_id:r.id,tanggal:tgl,hm:r.hm,hm_alat:r.alat,hm_offset:r.off||0,dicatat_oleh:oleh,catatan:r.reset?'Meter diganti':'',...(r.reset?{reset_meter:true}:{}),dibuat:F.serverTimestamp()}));
   ops.push(b=>b.update(F.doc(db,'mesin',r.id),{hm:r.hm,hm_tgl:tgl,hm_sementara:F.deleteField(),...(r.reset?{hm_offset:r.off}:{})}))});
   if(jam!=null)ops.push(b=>b.set(F.doc(db,'jam_olah',tgl),{tanggal:tgl,jam:jam}));
   for(let k=0;k<ops.length;k+=400){const b=F.writeBatch(db);ops.slice(k,k+400).forEach(o=>o(b));await b.commit()}}}}
let API,M=[],V={},RS={},FLAG={},msg='';
const r1=x=>Math.round(x*10)/10;
function calc(m,v){const x=parseFloat(v),R=RS[m.id],ofs=m.hm_offset||0;if(v===''||v==null)return null;
 if(isNaN(x))return{err:'Isi dengan angka.'};
 if(R&&R.on){const data=R.data!==''&&R.data!=null?parseFloat(R.data):r2((m.hm||0)+x);return{x,data,off:r2(data-x),reset:true}}
 return{x,data:r2(x+ofs),off:ofs,reset:false}}
const val=(m,c,tgl)=>{
 if(c.err)return{k:'er',t:c.err,block:true};
 const ex=c.reset?`HM data ${N(c.data)}, offset baru ${N(c.off)}. `:(c.off?`HM data ${N(c.data)} (alat ${N(c.x)} + offset ${N(c.off)}). `:'');
 if(m.hm==null)return{k:'wr',t:ex+'Belum ada HM sebelumnya. Angka ini menjadi HM awal.'};
 if(m.hm_sementara&&!c.reset)return{k:'wr',t:ex+'HM sebelumnya hanya sementara. Angka ini menjadi HM awal.'};
 if(m.hm_tgl&&tgl<m.hm_tgl)return{k:'er',t:'Tanggal lebih lama dari catatan terakhir ('+D(m.hm_tgl)+').',block:true};
 const gap=Math.max(1,Math.round((new Date(tgl)-new Date(m.hm_tgl))/864e5)),dl=c.data-m.hm;
 if(dl<0)return{k:'er',t:ex+'HM data lebih kecil dari HM terakhir ('+N(m.hm)+'). '+(c.reset?'Periksa HM data lanjutan.':'Kalau meter diganti, tekan "Meter diganti?" di bawah.'),block:true};
 if(c.reset)return{k:'wr',t:ex+'Naik '+N(dl)+' HM dari HM terakhir.'};
 if(dl>24*gap+8)return{k:'wr',t:ex+'Naik '+N(dl)+' HM dalam '+gap+' hari, lebih dari 24 jam per hari.',confirm:true};
 return{k:'up',t:ex+'Naik '+N(dl)+' HM'}};
let TAB='in',RW='';
const nf=(x,d=0)=>x==null||x===''||isNaN(x)?'-':(+x).toLocaleString('id-ID',{minimumFractionDigits:d,maximumFractionDigits:d});
const addD=(s,n)=>{const d=new Date(s+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const dm=s=>s?String(s).split('-').reverse().join('/'):'';
const rk=a=>ORDER.indexOf(a)<0?99:ORDER.indexOf(a);
const tabs=()=>'<div class="tabs noprint">'+[['in','Input'],['rk','Rekap harian'],['mn','Monitoring mingguan']].map(t=>`<button data-t="${t[0]}" aria-selected="${t[0]===TAB}">${t[1]}</button>`).join('')+'</div>';
function bindTabs(){document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{TAB=b.dataset.t;draw()})}
async function rekap(){
 const end=RW||today(),days=[...Array(7)].map((_,i)=>addD(end,i-6)),H={};
 (await API.log(addD(end,-14))).filter(r=>r.tanggal<=end).forEach(r=>(H[r.mesin_id]=H[r.mesin_id]||{})[r.tanggal]=+r.hm);
 const dl=(id,d)=>{const h=H[id]||{};if(h[d]==null)return null;let p=null;Object.keys(h).filter(x=>x<d).sort().forEach(x=>p=h[x]);return p==null?null:r2(h[d]-p)};
 const by={};M.forEach(m=>(by[m.area]=by[m.area]||[]).push(m));
 const body=Object.keys(by).sort((a,b)=>rk(a)-rk(b)||a.localeCompare(b)).map(a=>`<tr class="ar"><td colspan="10">${E(a)}</td></tr>`+by[a].sort((x,y)=>String(x.nama).localeCompare(String(y.nama),'id',{numeric:true})).map(m=>{let t=0,any=false;
  const c=days.map(d=>{const v=dl(m.id,d);if(v==null)return'<td class="z">-</td>';any=true;t+=v;return`<td class="${v>24?'wr':''}">${N(v)}</td>`}).join('');
  return`<tr><td>${E(m.nama)}</td>${c}<td><b>${any?N(r2(t)):'-'}</b></td><td>${N(m.hm)}</td></tr>`}).join('')).join('');
 return`<div class="card noprint"><label for="rw">Minggu berakhir pada tanggal</label><input id="rw" type="date" value="${end}" max="${today()}"></div><div class="sh"><span>Rekap HM harian (jam jalan per hari)</span><span class="sub">${dm(days[0])} sampai ${dm(end)}</span></div><div class="tw"><table class="t"><tr><th>Mesin</th>${days.map(d=>`<th>${d.slice(8)}/${d.slice(5,7)}</th>`).join('')}<th>Total</th><th>HM akhir</th></tr>${body}</table></div><p class="sub">Selisih HM dengan catatan sebelumnya. Angka merah berarti lebih dari 24 jam. Tanda - berarti belum ada input pada hari itu.</p>`}
const MORD=['SCREW PRESS','PRESS CAGE PRESS','CONNECTOR','BUSH','TIE ROD','LENGTHEN','LONG','EXPELLER','ROTOR','STATOR','SCREW EMPTY','PRESS CAGE EMPTY','TURBIN','GENSET','DECANTER','VIBRATING SCREEN PRESS','CLAYBATH','VIBRATING SCREEN EB'];
async function monit(){
 const SPD=await API.sp(),MS=Object.fromEntries(M.map(m=>[m.id,m])),G={},n=new Date(),p2=x=>String(x).padStart(2,'0');
 const stamp=`${p2(n.getDate())}/${p2(n.getMonth()+1)}/${n.getFullYear()} ${p2(n.getHours())}:${p2(n.getMinutes())}`,mg=Math.min(4,Math.ceil(n.getDate()/7));
 SPD.filter(s=>MS[s.mesin_id]).forEach(s=>{const k=String(s.komponen).toUpperCase();(G[k]=G[k]||[]).push(s)});
 const rk2=k=>{const i=MORD.findIndex(o=>k.includes(o));return i<0?99:i},keys=Object.keys(G).sort((a,b)=>rk2(a)-rk2(b)||a.localeCompare(b));
 return`<div class="card noprint"><div class="sub">Minggu ${mg} ${n.toLocaleDateString('id-ID',{month:'long',year:'numeric'})}. "S/D hari ini" mengikuti HM terakhir yang diinput.</div><button class="btn" id="pr" style="margin-top:8px;width:100%">Cetak / Simpan PDF</button></div>
 <div style="text-align:center;font-weight:700;margin-top:10px">PT. KHARISMA ALAM PERSADA MILL<br>WEEKLY HOUR METER MONITORING</div>`+(keys.map((k,i)=>{
  const rows=G[k].sort((a,b)=>String(MS[a.mesin_id].nama).localeCompare(String(MS[b.mesin_id].nama),'id',{numeric:true})),f=rows[0],d=/ROTOR|STATOR/.test(k)?2:0;
  return`<div class="sh"><span>${i+1}. ${E(k)}</span><span class="sub">${stamp}</span></div><div class="tw"><table class="t"><tr><th rowspan="2">No</th><th rowspan="2">Jenis alat</th><th colspan="2">Service terakhir</th><th rowspan="2">S/D hari ini</th><th rowspan="2">Total HM</th><th rowspan="2">Keterangan service terakhir${f.standar_hm?'<br>('+(f.standar_min_hm?f.standar_min_hm+' - ':'')+f.standar_hm+' HM)':''}</th></tr><tr><th>Tgl</th><th>HM</th></tr>
  ${rows.map((s,j)=>{const m=MS[s.mesin_id],h=m.hm!=null?+m.hm:null,t=h!=null&&s.hm_service_terakhir!=null?h-s.hm_service_terakhir:null,lim=s.standar_min_hm||s.standar_hm;
   return`<tr><td class="c">${j+1}</td><td class="c">${E(String(m.nama).toUpperCase())}</td><td class="c">${dm(s.tgl_service_terakhir)}</td><td>${s.tgl_service_terakhir?nf(s.hm_service_terakhir,d):''}</td><td>${nf(h,d)}</td><td class="${t!=null&&lim&&t>=lim?'rd':''}">${nf(t,d)}</td><td class="k">${E(s.keterangan)}</td></tr>`}).join('')}</table></div>`}).join('')||'<p class="empty sub">Belum ada data sparepart.</p>')}
async function other(){
 $('#bar').hidden=true;
 const top=`<div class="top noprint"><a href="menu.html">Menu</a><span class="sub">${M.length} unit</span></div><h1 class="noprint">Input HM mesin</h1>${tabs()}`;
 app.innerHTML=top+'<p class="sub">Memuat...</p>';bindTabs();
 try{if(!API.log)throw new Error('Fitur ini butuh koneksi Firebase.');
  app.innerHTML=top+(TAB==='rk'?await rekap():await monit());bindTabs();
  if($('#rw'))$('#rw').onchange=e=>{RW=e.target.value;draw()};if($('#pr'))$('#pr').onclick=()=>print()}
 catch(e){app.innerHTML=top+'<div class="note bad">Gagal memuat: '+E(e.message||e)+'</div>';bindTabs()}}
function draw(){
 if(TAB!=='in')return other();
 const tgl=($('#tg')||{}).value||today(),who=($('#nm')||{}).value??localStorage.getItem('hmoleh')??'',jam=($('#jm')||{}).value??'';
 const by={};M.forEach(m=>(by[m.area]=by[m.area]||[]).push(m));
 const areas=Object.keys(by).sort((a,b)=>(ORDER.indexOf(a)<0?99:ORDER.indexOf(a))-(ORDER.indexOf(b)<0?99:ORDER.indexOf(b))||a.localeCompare(b));
 app.innerHTML=`<div class="top"><a href="menu.html">Menu</a><span class="sub">${M.length} unit</span></div><h1>Input HM mesin</h1>${tabs()}${msg?'<div class="note ok">'+E(msg)+'</div>':''}
 <div class="card"><div class="hd"><div><label for="tg">Tanggal</label><input id="tg" type="date" value="${tgl}" max="${today()}"></div><div><label for="nm">Nama pencatat</label><input id="nm" value="${E(who)}" autocomplete="name"></div></div>
 <div style="margin-top:10px"><label for="jm">Jam olah hari ini (CBC), opsional</label><input id="jm" inputmode="decimal" autocomplete="off" placeholder="contoh 19.5" value="${E(jam)}"><div class="d er" id="jme"></div></div></div>
 <p class="sub" style="margin:10px 2px 0">Isi HM sesuai angka yang tertera di alat. Kalau meter pernah diganti, sistem menambahkan offset otomatis.</p>`+
 areas.map(a=>`<h2>${E(a)}</h2><div class="g">`+by[a].sort((x,y)=>String(x.nama).localeCompare(String(y.nama),'id',{numeric:true})).map(m=>{const ofs=m.hm_offset||0,R=RS[m.id]&&RS[m.id].on;
  return `<div class="r"><div><b>${E(m.nama)}</b><span class="id">${E(m.id)}</span>${m.hm_sementara?'<span class="pill">HM sementara</span>':''}${ofs?'<span class="pill">Meter diganti</span>':''}</div><input data-id="${E(m.id)}" inputmode="decimal" autocomplete="off" aria-label="HM alat ${E(m.nama)}" value="${E(V[m.id]??'')}"><div class="l">Terakhir ${N(m.hm)}${ofs?' (alat '+N(m.hm-ofs)+')':''}, ${D(m.hm_tgl)} &nbsp;<a href="#" data-r="${E(m.id)}">${R?'Batal meter diganti':'Meter diganti?'}</a></div>${R?`<div class="rs"><label>HM data lanjutan pada tanggal ini<input data-rd="${E(m.id)}" inputmode="decimal" autocomplete="off" placeholder="kosong = HM terakhir + angka alat" value="${E(RS[m.id].data||'')}"></label></div>`:''}<div class="d" id="d-${E(m.id)}"></div></div>`}).join('')+'</div>').join('');
 document.querySelectorAll('.r input[data-id]').forEach(i=>i.oninput=()=>{i.value=d2(i.value);V[i.dataset.id]=i.value;chk()});
 document.querySelectorAll('.r input[data-rd]').forEach(i=>i.oninput=()=>{i.value=d2(i.value);RS[i.dataset.rd].data=i.value;chk()});
 document.querySelectorAll('a[data-r]').forEach(a=>a.onclick=e=>{e.preventDefault();const id=a.dataset.r;RS[id]=RS[id]&&RS[id].on?null:{on:true,data:''};draw()});
 bindTabs();$('#tg').onchange=chk;$('#jm').oninput=e=>{e.target.value=d1(e.target.value);chk()};chk()}
function chk(){const tgl=$('#tg').value;let n=0,bad=0;
 M.forEach(m=>{const el=document.getElementById('d-'+m.id);if(!el)return;const c=calc(m,V[m.id]),v=c&&val(m,c,tgl);let h='';
  if(v){n++;h=`<span class="${v.k}">${E(v.t)}</span>`;
   if(v.confirm)h+=`<label><input type="checkbox" data-f="ok" data-id="${m.id}" ${FLAG[m.id]==='ok'?'checked':''}>Angka sudah benar</label>`;
   if(v.block||(v.confirm&&FLAG[m.id]!=='ok'))bad++}
  el.className='d '+(v?v.k:'');
  if(el.dataset.h!==h){el.innerHTML=h;el.dataset.h=h;el.querySelectorAll('input[data-f]').forEach(c=>c.onchange=()=>{FLAG[c.dataset.id]=c.checked?c.dataset.f:'';chk()})}});
 const jm=$('#jm').value,jbad=jm!==''&&(parseFloat(jm)>24||isNaN(parseFloat(jm)));if(jbad)bad++;$('#jme').textContent=jbad?'Jam olah harus antara 0 dan 24.':'';
 $('#bar').hidden=false;$('#cnt').textContent=n?n+' unit terisi'+(bad?', '+bad+' perlu dicek':''):'Belum ada yang diisi';$('#sv').disabled=!n&&jm===''||bad>0}
async function simpan(){const tgl=$('#tg').value,oleh=$('#nm').value.trim(),jmv=$('#jm').value;
 const rows=M.filter(m=>V[m.id]!==''&&V[m.id]!=null).map(m=>{const c=calc(m,V[m.id]);return{id:m.id,hm:c.data,alat:c.x,off:c.off,reset:c.reset}});
 if(!oleh){alert('Isi nama pencatat dulu.');$('#nm').focus();return}
 if(!confirm('Simpan '+rows.length+' unit'+(jmv!==''?' dan jam olah':'')+' untuk tanggal '+D(tgl)+'?'))return;
