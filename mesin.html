a{color:var(--ac)}.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}

.row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.row b{font-size:18px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:14px 0 4px}

.tabs button[aria-selected=true]{background:var(--ink);color:#fff;border-color:var(--ink)}

.gauge{position:relative;height:10px;background:#dde3e8;border-radius:2px;margin:11px 0 7px;border-right:3px solid var(--ink)}
.gauge i{position:absolute;inset:0 auto 0 0;background:var(--c)}.gauge u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:0}.dl div{padding:9px 0;border-bottom:1px solid var(--line)}.dl div:nth-child(odd){color:var(--mut)}.dl div:nth-child(even){text-align:right;font-weight:500}
.jn{font-size:14px;border:1px solid var(--line);border-radius:3px;padding:0 6px}
.note{background:#fff4d6;border:1px solid #e3c56a;border-radius:4px;padding:8px 10px;font-size:15px;margin-bottom:12px}
.ok{background:#e3f1e8;border:1px solid #8fc3a2}.er{background:#fbe4e1;border:1px solid #e0958e}
label{display:block;margin-top:10px;font-weight:500}input{width:100%;font:inherit;padding:11px;border:1px solid var(--line);border-radius:4px;margin-top:4px;background:#fff}
.chk{display:flex;gap:8px;align-items:center;margin-top:10px}.chk input{width:22px;height:22px;margin:0}
.pick a{display:block;text-decoration:none;color:var(--ink)}.empty{color:var(--mut);padding:10px 0}

let C={};try{C=JSON.parse(localStorage.getItem('jmcfg')||'{}')}catch(e){}
const ID=new URLSearchParams(location.search).get('id'),app=document.getElementById('app'),$=s=>document.querySelector(s);
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const N=x=>x==null||x===''||isNaN(x)?'-':String(Math.round(+x));
const D=s=>{if(!s)return'-';const d=new Date(s);return isNaN(d)?E(s):d.toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})};

const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
function login(U,au){app.innerHTML='<form class="card" id="lg"><b>Masuk</b><label>Email<input id="e" type="email" autocomplete="username"></label><label>Password<input id="p" type="password" autocomplete="current-password"></label><button class="btn">Masuk</button><p id="m" class="sub"></p></form>';
 $('#lg').onsubmit=async ev=>{ev.preventDefault();try{await U.signInWithEmailAndPassword(au,$('#e').value.trim(),$('#p').value)}catch(x){$('#m').textContent='Email atau password salah.'}}}
async function connect(){
 if(!C.firebase||!C.firebase.apiKey)return{demo:true,mesin:async id=>DEMO.mesin.find(m=>m.id===id)||null,vital:async()=>DEMO.mesin,sp:async id=>DEMO.sp.filter(s=>s.mesin_id===id),pg:async id=>DEMO.pg.filter(r=>r.mesin_id===id),simpan:async()=>{}};
 const[A,F,U]=await Promise.all([import(FBU+'firebase-app.js'),import(FBU+'firebase-firestore.js'),import(FBU+'firebase-auth.js')]);
 const ap=A.initializeApp(C.firebase),db=F.getFirestore(ap),au=U.getAuth(ap);
 await new Promise(res=>U.onAuthStateChanged(au,u=>u?res():login(U,au)));
 const all=async(c,f,v)=>(await F.getDocs(f?F.query(F.collection(db,c),F.where(f,'==',v)):F.collection(db,c))).docs.map(d=>({id:d.id,...d.data()}));
 return{mesin:async id=>{const s=await F.getDoc(F.doc(db,'mesin',id));return s.exists()?{id,...s.data()}:null},vital:()=>all('mesin','vital',true),sp:id=>all('sparepart_standar','mesin_id',id),pg:id=>all('penggantian','mesin_id',id),
  simpan:async(m,d)=>{await F.setDoc(F.doc(db,'hm_log',m.id+'_'+d.tanggal),{mesin_id:m.id,tanggal:d.tanggal,hm:d.hm,dicatat_oleh:d.oleh||au.currentUser.email,catatan:d.catatan||'',dibuat:F.serverTimestamp()});
   if(!m.hm_tgl||d.tanggal>=m.hm_tgl)await F.updateDoc(F.doc(db,'mesin',m.id),{hm:d.hm,hm_tgl:d.tanggal})}}}
function stat(s,h){const u=h-s.hm_service_terakhir,sd=s.standar_hm;
 if(!sd)return{u,k:'x',t:'Standar belum diisi',p:0,l:0,m:'Umur terpakai '+N(u)+' HM. Isi standar HM agar status terhitung.'};
 const lo=s.standar_min_hm||.8*sd,k=u>=sd?'r':u>=lo?'y':'g';
 return{u,k,t:{r:'Lewat standar',y:'Segera ganti',g:'Aman'}[k],p:Math.min(1,u/sd),l:lo/sd,r:u/sd,m:'Terpakai '+N(u)+' dari '+N(sd)+' HM. '+(u>=sd?'Lewat '+N(u-sd)+' HM.':'Sisa '+N(sd-u)+' HM.')}}
const SPEK=[['Daya','daya_kw',' kW'],['Arus','arus_a',' A'],['Merk','merk',''],['Putaran','rpm',' RPM'],['Tipe starter','tipe_starter',''],['MCCB','mccb_a',' A'],['Kontaktor 1','kontaktor_1',''],['Kontaktor 2','kontaktor_2',''],['Kontaktor 3','kontaktor_3',''],['Setting thermal','setting_thermal_a',' A']];
function pSp(m,sp,pg){
 const it=sp.map(s=>{const t=stat(s,+m.hm),v=pg.filter(p=>String(p.komponen).toUpperCase()===String(s.komponen).toUpperCase()&&p.ketahanan_hm>0).map(p=>p.ketahanan_hm),av=v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):0;
  return{o:{r:0,y:1,g:2,x:3}[t.k],p:t.r||0,h:`<li class="sp k-${t.k}"><div class="row"><b>${E(cap(s.komponen))}</b><span class="tag">${t.t}</span></div><div class="gauge"><i style="width:${t.p*100}%"></i>${t.l&&t.l<1?`<u style="left:${t.l*100}%"></u>`:''}</div><div>${t.m}</div><div class="sub">Dipasang pada HM ${N(s.hm_service_terakhir)}, ${D(s.tgl_service_terakhir)}.${av?'<br>Rata-rata bertahan '+av+' HM dari '+v.length+' penggantian.':''}</div></li>`}}).sort((a,b)=>a.o-b.o||b.p-a.p);
 const rg=[...pg].sort((a,b)=>String(b.tanggal).localeCompare(String(a.tanggal)));
 return`<h2>Sisa HM sparepart</h2>${it.length?'<ul>'+it.map(i=>i.h).join('')+'</ul>':'<p class="empty">Belum ada sparepart yang dipantau untuk mesin ini.</p>'}
 <h2>Riwayat penggantian</h2>${rg.length?'<ul>'+rg.map(p=>`<li class="card"><div class="row"><b>${E(cap(p.komponen))}</b><span class="sub">${D(p.tanggal)}</span></div><div>Diganti pada HM ${N(p.hm)}${p.hm_sebelumnya?', bertahan <b>'+N(p.ketahanan_hm||p.hm-p.hm_sebelumnya)+' HM</b>':''}.</div>${p.alasan?'<div class="sub">Alasan: '+E(p.alasan)+'</div>':''}</li>`).join('')+'</ul>':'<p class="empty">Belum ada riwayat penggantian.</p>'}`}
function pSpek(m){const r=SPEK.filter(s=>m[s[1]]!=null&&m[s[1]]!=='').map(s=>`<div>${s[0]}</div><div>${E(m[s[1]])}${s[2]}</div>`);
 if(m.thermal_min_a!=null)r.push('<div>Rentang thermal</div><div>'+E(m.thermal_min_a)+' sampai '+E(m.thermal_max_a)+' A</div>');
 return`<h2>Spesifikasi mesin</h2><div class="card"><div class="dl"><div>ID mesin</div><div>${E(m.id)}</div><div>Area</div><div>${E(cap(m.area))}</div>${r.join('')}</div></div>${r.length?'':'<p class="empty">Spesifikasi belum diisi untuk mesin ini.</p>'}`}
function pHm(m,api,done){
 return`<h2>Input HM</h2><form class="card" id="hf"><div class="sub">HM terakhir ${N(m.hm)} (${D(m.hm_tgl)})</div><label>HM baru<input id="hv" inputmode="decimal" autocomplete="off" required></label><label>Tanggal<input id="ht" type="date" value="${today()}" required></label><label>Nama pencatat<input id="hn" value="${E(localStorage.getItem('hmoleh')||'')}" autocomplete="name"></label><label>Catatan (opsional)<input id="hc"></label><div id="hk"></div><div id="hx" class="note er" hidden></div><button class="btn">Simpan HM</button></form>`}
function bindHm(m,api,redraw){const f=$('#hf');if(!f)return;let warn=false;
 f.onsubmit=async ev=>{ev.preventDefault();const hx=$('#hx');hx.hidden=true;
  const v=parseFloat($('#hv').value.replace(',','.')),t=$('#ht').value,er=x=>{hx.textContent=x;hx.hidden=false};
  if(isNaN(v)||v<0)return er('Isi HM dengan angka.');
  if(t>today())return er('Tanggal tidak boleh lebih dari hari ini.');
  if(v<+m.hm)return er('HM baru ('+N(v)+') lebih kecil dari HM terakhir ('+N(m.hm)+'). Cek lagi angkanya. Kalau meter diganti atau direset, minta admin memakai Reset meter.');
  const hari=Math.max(1,Math.round((new Date(t)-new Date(m.hm_tgl))/864e5));
  if(v-m.hm>24*hari+8&&!$('#ok')){$('#hk').innerHTML='<div class="note">Naik '+N(v-m.hm)+' HM dalam '+hari+' hari, lebih dari 24 jam per hari. <label class="chk"><input type="checkbox" id="ok">Angka sudah benar</label></div>';return}
  if($('#ok')&&!$('#ok').checked)return er('Centang bahwa angka sudah benar, atau perbaiki HM-nya.');
  const oleh=$('#hn').value.trim();localStorage.setItem('hmoleh',oleh);
  try{await api.simpan(m,{hm:v,tanggal:t,oleh,catatan:$('#hc').value.trim()});if(!m.hm_tgl||t>=m.hm_tgl){m.hm=v;m.hm_tgl=t}redraw('HM '+N(v)+' tersimpan.')}catch(x){er('Gagal menyimpan: '+(x.message||x))}}}
async function show(api){
 const demo=api.demo?'<div class="note">Mode contoh: belum tersambung ke Firebase. Data hanya contoh dan HM yang diinput tidak disimpan.</div>':'';
 if(!ID){const l=(await api.vital()).sort((a,b)=>(a.nama||'').localeCompare(b.nama||''));
  app.innerHTML=demo+'<h1>Pilih mesin</h1><input id="f" placeholder="Cari nama atau ID mesin" aria-label="Cari mesin" style="margin:10px 0"><ul class="pick" id="l"></ul>';
  const r=()=>{const f=$('#f').value.toLowerCase();$('#l').innerHTML=l.filter(m=>(m.nama+m.id).toLowerCase().includes(f)).map(m=>`<li class="card"><a href="?id=${encodeURIComponent(m.id)}"><div class="row"><b>${E(m.nama)}</b><span class="sub">${E(m.id)}</span></div><div class="sub">${E(cap(m.area))}</div></a></li>`).join('')||'<li class="empty">Tidak ada mesin yang cocok.</li>'};
  $('#f').oninput=r;r();return}
 const m=await api.mesin(ID);
 if(!m){app.innerHTML=demo+'<h1>Mesin tidak ditemukan</h1><p class="sub">ID '+E(ID)+' belum ada di database. Cek kode pada barcode.</p><a href="'+location.pathname+'">Pilih mesin lain</a>';return}
 const[sp,pg]=await Promise.all([api.sp(ID),api.pg(ID)]);
 let tab=['hm','spek','sp'].includes(location.hash.slice(1))?location.hash.slice(1):'sp',msg='';
 const draw=()=>{const T=[['hm','Input HM'],['spek','Spesifikasi'],['sp','Sparepart']];
  app.innerHTML=demo+`<div class="top"><a href="${location.pathname}">Semua mesin</a><span class="sub">${E(m.id)}</span></div><h1>${E(m.nama)}</h1><div class="sub">${E(cap(m.area))}</div>
  <div class="card" style="margin-top:12px"><div class="sub">HM sekarang</div><div class="hm" style="font-size:34px;line-height:1.1">${N(m.hm)}</div><div class="sub">Diperbarui ${D(m.hm_tgl)}</div></div>
  <div class="tabs" role="tablist">${T.map(t=>`<button role="tab" data-t="${t[0]}" aria-selected="${t[0]===tab}">${t[1]}</button>`).join('')}</div>
  ${msg?'<div class="note ok">'+E(msg)+'</div>':''}${tab==='sp'?pSp(m,sp,pg):tab==='spek'?pSpek(m):pHm(m,api)}`;
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;msg='';history.replaceState(null,'','#'+tab);draw()});
  if(tab==='hm')bindHm(m,api,s=>{msg=s;tab='sp';draw()})};

connect().then(show).catch(e=>{app.innerHTML='<h1>Gagal memuat data</h1><p class="sub">'+E(e.message||e)+'</p>'});
</script></body></html>
