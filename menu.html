<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Menu Maintenance</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
:root{--w:#f3f8ff;--blue:#0b2f7a;--ink:#f3f8ff;--mut:#b9cdf2}
*{box-sizing:border-box}
html{background:#082a6b;overflow-x:hidden}body{overflow-x:hidden}
body{margin:0;min-height:100vh;color:var(--ink);font:400 17px/1.45 'Barlow',system-ui,sans-serif;
 background:linear-gradient(rgba(255,255,255,.065) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.065) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px),radial-gradient(ellipse at 50% 34%,#1b4cab 0%,#0f3a89 46%,#082a6b 100%);
 background-size:20px 20px,20px 20px,100px 100px,100px 100px,100% 100%}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:34px 20px 44px}
header{text-align:center}
.head{display:table;margin:0 auto}
.out{font:700 24px/1 'Barlow Condensed',sans-serif;letter-spacing:.32em;color:transparent;-webkit-text-stroke:1px var(--w);padding-left:.32em}
.bar{height:11px;margin:12px 0;background:repeating-linear-gradient(135deg,var(--w) 0 4px,transparent 4px 9px)}
h1{margin:0;font:700 clamp(44px,12.5vw,112px)/.95 'Barlow Condensed','Arial Narrow','Roboto Condensed',sans-serif;letter-spacing:.01em}
.co{margin:18px 0 0;font-size:17px}.dt{margin:2px 0 0;color:var(--mut);font-size:16px}
nav{display:grid;gap:14px;margin-top:30px}
.t{display:grid;grid-template-columns:82px 1fr;min-height:94px;background:rgba(6,30,86,.82);border:2px solid var(--w);color:var(--ink);text-decoration:none}
.t:hover{background:rgba(255,255,255,.16)}.t:active{transform:translateY(1px)}
.t:focus-visible{outline:3px solid #fff;outline-offset:4px}
.ic{background:var(--w);color:var(--blue);display:flex;align-items:center;justify-content:center}
.ic svg{width:40px;height:40px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tx{padding:14px 16px;align-self:center}
.tx b{display:block;font:700 27px/1.1 'Barlow Condensed',sans-serif;letter-spacing:.01em}
.tx span{display:block;margin-top:4px;color:var(--mut);font-size:16px}
.adm{margin-top:28px;text-align:center;color:var(--mut);font-size:15px}
.adm a{display:inline-block;margin-top:4px;padding:8px 4px;color:var(--ink);font-size:17px;font-weight:500}
@media(min-width:720px){nav{grid-template-columns:repeat(3,1fr)}.t{grid-template-columns:1fr;grid-template-rows:88px 1fr;min-height:0}.tx{align-self:start}.wrap{padding-top:52px}}
</style></head><body>
<svg id="bg" aria-hidden="true"></svg>
<div class="wrap">
<header><div class="head"><div class="out">SISTEM</div><div class="bar"></div><h1>MAINTENANCE</h1><div class="bar"></div></div><p class="co">PT Kharisma Alam Persada 2</p><p class="dt" id="dt"></p></header>
<nav>
 <a class="t" href="index.html"><div class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="1"/><path d="M9 4V2.5h6V4M8.5 10h7M8.5 14h7M8.5 18h4"/></svg></div><div class="tx"><b>Input work order maintenance</b><span>Catat job harian, lihat rekap dan lembur</span></div></a>
 <a class="t" href="hm_alat.html"><div class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17a8 8 0 1 1 16 0"/><path d="M12 17l4-5"/><circle cx="12" cy="17" r="1.2"/></svg></div><div class="tx"><b>Input monitoring HM alat</b><span>HM, job, solar, dan service loader, excavator, kendaraan</span></div></a>
 <a class="t" href="mesin.html"><div class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg></div><div class="tx"><b>Cek mesin</b><span>HM, spesifikasi, dan sisa umur sparepart</span></div></a>
</nav>
<div class="adm">Khusus admin<br><a href="impor.html">Impor data ke database</a></div>
</div>
<script>
document.getElementById('dt').textContent=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
// Latar gambar teknik: bingkai ganda dan roda gigi garis, arsir, dan solid
function gear(cx,cy,r,n,th,rot){let d='';const s=2*Math.PI/n;for(let i=0;i<n;i++){const a=rot+i*s;[[a-s*.28,r],[a-s*.18,r+th],[a+s*.18,r+th],[a+s*.28,r]].forEach(([t,q],j)=>{d+=(i+j?'L':'M')+(cx+q*Math.cos(t)).toFixed(1)+' '+(cy+q*Math.sin(t)).toFixed(1)})}return d+'Z'}
const G=[[1,.05,.25,16,'h'],[.975,.3,.06,12,'f'],[.95,.4,.15,14,'o'],[0,.6,.2,14,'o'],[.07,.84,.12,12,'f'],[.1,1,.27,16,'h'],[.6,1,.11,12,'o'],[.27,0,.1,12,'o'],[.62,.07,.05,10,'f']];
function draw(){const w=innerWidth,h=Math.max(innerHeight,document.body.scrollHeight),b=Math.max(w,innerHeight)*.5,e=w<600?12:28;
 let s=`<defs><pattern id="hh" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#f3f8ff" stroke-width="1.3"/></pattern></defs>`;
 s+=`<rect x="${e}" y="${e}" width="${w-2*e}" height="${h-2*e}" fill="none" stroke="#f3f8ff" stroke-opacity=".5" stroke-width="1.5"/><rect x="${e+8}" y="${e+8}" width="${w-2*e-16}" height="${h-2*e-16}" fill="none" stroke="#f3f8ff" stroke-opacity=".3" stroke-width="1"/>`;
 G.filter((g,i)=>w>=600||(i!==1&&i!==8)).forEach(([x,y,k,n,t],i)=>{const r=k*b,cx=x*w,cy=y*h,d=gear(cx,cy,r,n,r*.2,i*.3);
  if(t==='f')s+=`<path d="${d}M${cx+r*.4} ${cy}a${r*.4} ${r*.4} 0 1 0 ${-r*.8} 0a${r*.4} ${r*.4} 0 1 0 ${r*.8} 0Z" fill="#f3f8ff" fill-rule="evenodd" opacity=".8"/>`;
  else s+=`<g opacity="${t==='h'?.5:.42}"><path d="${d}" fill="${t==='h'?'url(#hh)':'none'}" stroke="#f3f8ff" stroke-width="2"/><circle cx="${cx}" cy="${cy}" r="${r*.62}" fill="none" stroke="#f3f8ff" stroke-width="1.6"/><circle cx="${cx}" cy="${cy}" r="${r*.2}" fill="none" stroke="#f3f8ff" stroke-width="1.6"/></g>`});
 const el=document.getElementById('bg');el.setAttribute('viewBox',`0 0 ${w} ${h}`);el.style.height=h+'px';el.style.position='absolute';el.innerHTML=s}
draw();addEventListener('resize',draw);
</script>
</body></html>
