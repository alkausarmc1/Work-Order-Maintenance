<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Menu Maintenance</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;700&display=swap">
<style>
:root{--palm:#1e5a3c;--deep:#0f2e21;--oil:#f0a81c;--bg:#e7ebe8;--panel:#fff;--ink:#0f2e21;--mut:#46545c;--edge:#9db0a5}
@media(prefers-color-scheme:dark){:root{--bg:#0e1b15;--panel:#16281f;--ink:#e8f0ea;--mut:#a9b8ae;--edge:#2f5a45}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.4 'Barlow Semi Condensed',system-ui,sans-serif}
header{background:var(--palm);color:#fff}
.in{max-width:860px;margin:0 auto;padding:26px 16px 22px}
.co{font-size:15px;opacity:.82}
h1{margin:6px 0 2px;font-size:44px;line-height:1;font-weight:700;letter-spacing:-.01em}
.dt{font-size:17px;opacity:.9}
.hz{height:9px;background:repeating-linear-gradient(-45deg,var(--oil) 0 12px,var(--deep) 12px 24px)}
main{max-width:860px;margin:0 auto;padding:20px 16px 40px}
nav{display:grid;gap:12px}
.t{display:grid;grid-template-columns:78px 1fr;min-height:92px;background:var(--panel);border:2px solid var(--edge);border-radius:3px;color:var(--ink);text-decoration:none}
.t:hover{border-color:var(--palm)}.t:active{transform:translateY(1px)}
.t:focus-visible{outline:3px solid var(--oil);outline-offset:3px}
.ic{background:var(--oil);color:var(--deep);display:flex;align-items:center;justify-content:center}
.ic svg{width:38px;height:38px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tx{padding:14px 16px;align-self:center}
.tx b{display:block;font-size:23px;line-height:1.15;font-weight:700}
.tx span{display:block;margin-top:3px;color:var(--mut);font-size:16px}
.adm{margin-top:26px;color:var(--mut);font-size:15px}
.adm a{display:inline-block;margin-top:4px;padding:8px 0;color:var(--ink);font-size:17px;font-weight:500}
@media(min-width:720px){nav{grid-template-columns:repeat(3,1fr)}.t{grid-template-columns:1fr;min-height:0}.ic{height:84px}.tx{align-self:start}h1{font-size:56px}}
</style></head><body>
<header><div class="in"><div class="co">PT Kharisma Alam Persada 2</div><h1>Maintenance</h1><div class="dt" id="dt"></div></div><div class="hz"></div></header>
<main>
<nav>
 <a class="t" href="index.html"><div class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="1"/><path d="M9 4V2.5h6V4M8.5 10h7M8.5 14h7M8.5 18h4"/></svg></div><div class="tx"><b>Input work order maintenance</b><span>Catat job harian, lihat rekap dan lembur</span></div></a>
 <a class="t" href="hm_alat.html"><div class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17a8 8 0 1 1 16 0"/><path d="M12 17l4-5"/><circle cx="12" cy="17" r="1.2"/></svg></div><div class="tx"><b>Input monitoring HM alat</b><span>HM, job, solar, dan service loader, excavator, kendaraan</span></div></a>
 <a class="t" href="mesin.html"><div class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg></div><div class="tx"><b>Cek mesin</b><span>HM, spesifikasi, dan sisa umur sparepart</span></div></a>
</nav>
<div class="adm">Khusus admin<br><a href="impor.html">Impor data ke database</a></div>
</main>
<script>document.getElementById('dt').textContent=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})</script>
</body></html>
